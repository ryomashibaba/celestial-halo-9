9" stroke-width="4"/><polyline points="1545.0,605.0 1565.0,605.0" fill="none" stroke="#e4c589" stroke-width="4"/><text x="945" y="450" font-family="Yu Gothic, sans-serif" font-size="20" fill="#e4c589">図書館・議場・市場</text><text x="955" y="486" font-family="Yu Gothic, sans-serif" font-size="16" fill="#e9f0ef">大空間の縁が街路と生活の入口になる</text><text x="865" y="678" font-family="Yu Gothic, sans-serif" font-size="18" fill="#81cfc4">← 外部街路　内部公共街路を通過　外部出口 →</text><text x="870" y="734" font-family="Yu Gothic, sans-serif" font-size="19" fill="#e9f0ef">支持体の中庭街路から入り、上部地盤へ</text><text x="870" y="778" font-family="Yu Gothic, sans-serif" font-size="18" fill="#9fb2be">主公共空間と背後の居住入口を分離</text><text x="870" y="818" font-family="Yu Gothic, sans-serif" font-size="18" fill="#9fb2be">住居は浅い外縁・中庭縁。設備は構造帯へ</text><text x="50" y="943" font-family="Yu Gothic, sans-serif" font-size="18" fill="#cd8c83">大空洞の中に施設を点置せず、公共空間の縁・上・下を街の住所にする。柱・支点の図は構造解ではありません。</text></svg>