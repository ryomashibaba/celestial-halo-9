 font-family="Yu Gothic, sans-serif" font-size="16" fill="#e9f0ef">大空間の縁が街路と生活の入口になる</text><text x="65" y="678" font-family="Yu Gothic, sans-serif" font-size="18" fill="#81cfc4">← 外部街路　内部公共街路を通過　外部出口 →</text><text x="70" y="734" font-family="Yu Gothic, sans-serif" font-size="19" fill="#e9f0ef">地上からP1を経て入り、P3へ上がる</text><text x="70" y="778" font-family="Yu Gothic, sans-serif" font-size="18" fill="#9fb2be">主公共空間と背後の居住入口を分離</text><text x="70" y="818" font-family="Yu Gothic, sans-serif" font-size="18" fill="#9fb2be">住居は浅い外縁・中庭縁。設備は構造帯へ</text><text x="855" y="162" font-family="Yu Gothic, sans-serif" font-size="27" fill="#e4c589">G5-02《空の共同庁》</text><text x="855" y="202" font-family="Yu Gothic, sans-serif" font-size="18" fill="#81cfc4">交差地盤 / 800×500m / 有効高さ180m</text><polygon points="870.0,340.0 1545.0,340.0 1545.0,375.0 870.0,375.0" fill="#344b5b" stroke="#81cfc4" stroke-width="2"/><polygon points="900.0,272.0 970.0,272.0 970.0,340.0 900.0,340.0" fill="#537b7d" stroke="#81cfc4" stroke-width="2"/><polygon points="912.0,282.0 957.0,282.0 957.0,322.0 912.0,322.0" fill="#101d29" stroke="#e4c589" stroke-width="2"/><polygon points="1028.0,272.0 1098.0,272.0 1098.0,340.0 1028.0,340.0" fill="#537b7d" stroke="#81cfc4" stroke-width="2"/><polygon points="1040.0,282.0 1085.0,282.0 1085.0,322.0 1040.0,322.0" fill="#101d29" stroke="#e4c589" stroke-width="2"/><polygon points="1156.0,272.0 1226.0,272.0 1226.0,340.0 1156.0,340.0" fill="#537b7d" stroke="#81cfc4" stroke-width="2"/><polygon points="1168.0,282.0 1213.0,282.0 1213.0,322.0 1168.0,322.0" fill="#101d29" stroke="#e4c589" stroke-width="2"/><polygon points="1284.0,272.0 1354.0,272.0 1354.0,340.0 1284.0,340.0" fill="#537b7d" stroke="#81cfc4" stroke-width="2"/><polygon points="1296.0,282.0 1341.0,282.0 1341.0,322.0 1296.0,322.0" fill="#101d29" stroke="#e4c589" stroke-width="2"/><polygon points="1412.0,272.0 1482.0,272.0 1482.0,340.0 1412.0,340.0" fill="#537b7d" stroke="#81cfc4" stroke-width="2"/><polygon points="1424.0,282.0 1469.0,28