name: HALO9 INT10-R1 correct actual E11 human-view clashes in inhabited civic canyon
on:
  push:
    branches:
      - research/r33-s27-d48-int10-r1-human-views-repair-20261106
    paths:
      - .github/workflows/halo9-int10-r1-macro-vision-repair.yml
      - studies/M3D-1S/J7/R33-S27/INT10_R1/author_image_root_cause_repair.py
permissions:
  contents: write
concurrency:
  group: halo9-int10-r1-20261106
  cancel-in-progress: false
jobs:
  actual_native_repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT10_R1
      SOURCE: studies/M3D-1S/J7/R33-S27/INT10/evidence/HALO9_INT10_INHABITED_CIVIC_CANYON_EDITABLE.blend.gz
      SHA: b5a38f353c814acaade8848ca420c3a38cfa724e41a1aafeb07a071244c6c94e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate exact INT10 true native research source and repair script
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" >/tmp/INT10_R1_SOURCE.blend
          printf '%s  %s\n' "$SHA" /tmp/INT10_R1_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_image_root_cause_repair.py"
      - name: Download verified official Blender 5.2.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9b10r1 && cd /tmp/halo9b10r1
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o sums
          sed -n '/blender-5.2.1-linux-x64.tar.xz/p' sums | sed 's/blender-5.2.1-linux-x64.tar.xz$/blender.tar.xz/' | sha256sum -c -
          tar -xf blender.tar.xz
      - name: True Blender geometry surgery on roads and canyon, render 6 original/additional views
        run: |
          set -euo pipefail
          B=/tmp/halo9b10r1/blender-5.2.1-linux-x64/blender
          timeout 1950s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT10_R1_SOURCE.blend --python "$ROOT/author_image_root_cause_repair.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/INT10_R1_NATIVE_AUTHOR.log"
          grep -F 'INT10_R1_HUMAN_SIGHTLINES_ACTUALLY_CORRECTED' "$ROOT/native/INT10_R1_NATIVE_AUTHOR.log"
      - name: Independent Blender process reopens saved changes and authenticates all 6 image files
        run: |
          set -euo pipefail
          cat >/tmp/verify_int10_r1.py <<'PY'
          import bpy,hashlib,json,math,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);root=p.parent
          r=json.loads((root/'INT10_R1_TRUE_EDIT_NOT_ART.json').read_text())
          assert p.name=='HALO9_INT10_R1_REBUILT_HUMAN_CIVIC_VIEWS.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['blend_sha256']
          sc=bpy.context.scene
          assert sc['CONSTRUCTION']=='HOLD' and sc['FORMAL_ART_ACCEPTED']==sc['COMPLETED_TARGETS']==0
          assert sc['INT10_R1_ART_ADOPTION']==0
          assert sc['INT10_R1_SOURCE_SHA256']==r['source_sha256']
          assert r['minecraft']=='HOLD' and r['formal_art_accepted']==r['completed_targets']==0
          assert r['W0_native_terrain_unchanged']
          assert r['camera_hits_before']['E11_NAVE_HUMAN']['name']=='INT10_W0_MARITIME_CIVIC_APPROACH'
          assert r['camera_hits_before']['E11_H1_HUMAN']['name']=='INT10_H1_HIGH_CITY_INHABITED_MARKET_STREET'
          assert r['camera_hits_after']['E11_NAVE_HUMAN']['name']!='INT10_W0_MARITIME_CIVIC_APPROACH'
          assert r['camera_hits_after']['E11_H1_HUMAN']['name']!='INT10_H1_HIGH_CITY_INHABITED_MARKET_STREET'
          target=bpy.data.objects['INT10_M247_C_EAST_INHABITED_STRATA']
          a=next(e for e in r['native_mesh_reconstruction'] if e['name']==target.name)
          assert len(target.data.polygons)==a['faces_after']>a['faces_before']
          for name,old in r['e11_original_matrices'].items():
              m=bpy.data.objects[name].matrix_world
              assert max(abs(m[i][j]-old[i][j]) for i in range(4) for j in range(4))<1e-6
          for name,sha in r['protected_W0_native_terrain_geometry_sha256'].items():
              ob=bpy.data.objects[name]
              h=hashlib.sha256()
              for v in ob.data.vertices:
                  h.update((','.join(format(float(x),'.10g') for x in v.co)+';').encode())
              assert h.hexdigest()==sha,name
          for name,sha in r['true_render_sha256'].items():
              file=root/'renders'/(name+'.png')
              with file.open('rb') as f:header=f.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',header[16:24])==(980,735)
              assert hashlib.sha256(file.read_bytes()).hexdigest()==sha
          print('INT10_R1_INDEPENDENT_REAL_GEOMETRY_AND_SIX_IMAGES_PASS_NOT_ART',flush=True)
          PY
          /tmp/halo9b10r1/blender-5.2.1-linux-x64/blender \
            --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT10_R1_REBUILT_HUMAN_CIVIC_VIEWS.blend" \
            --python /tmp/verify_int10_r1.py 2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'INT10_R1_INDEPENDENT_REAL_GEOMETRY_AND_SIX_IMAGES_PASS_NOT_ART' "$ROOT/native/INDEPENDENT.log"
      - name: Store editable BLEND plus all true render comparison images in research GitHub
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          from pathlib import Path
          import os,gzip,json,hashlib,base64
          from PIL import Image,ImageDraw,ImageStat
          root=Path(os.environ['ROOT']);n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          p=n/'HALO9_INT10_R1_REBUILT_HUMAN_CIVIC_VIEWS.blend'
          with p.open('rb') as src,gzip.open(e/(p.name+'.gz'),'wb',compresslevel=6) as dst:
              while chunk:=src.read(1048576):dst.write(chunk)
          names=('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL',
                 'INT10_NAVE_CIVIC_PUBLIC_ROOM','INT10_H1_MARKET_HUMAN_DEPTH',
                 'INT10_W0_TIDAL_AND_TWIN_FAULT')
          canvas=Image.new('RGB',(1740,916),(218,217,214))
          pen=ImageDraw.Draw(canvas);brightness={}
          for i,name in enumerate(names):
              im=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((580,427),Image.Resampling.LANCZOS)
              x=(i%3)*580;y=(i//3)*458
              canvas.paste(im,(x,y+26))
              pen.text((x+7,y+5),name,fill=(0,0,0))
          jpg=e/'INT10_R1_TRUE_SIX_VIEW_UNREVIEWED.jpg'
          canvas.save(jpg,quality=85,optimize=True)
          (e/'INT10_R1_TRUE_SIX_VIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          record=json.loads((n/'INT10_R1_TRUE_EDIT_NOT_ART.json').read_text())
          record['six_view_mean_brightness']=brightness
          record['six_view_montage_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          record['art']='UNREVIEWED_NOT_ADOPTED'
          (e/'INT10_R1_INDEPENDENT_TECH_NOT_ART.json').write_text(json.dumps(record,indent=2),encoding='utf8')
          print('INT10_R1_SIX_VIEW_NATIVE_EDIT_ARCHIVED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT10-R1: preserve human-eye civic canyon repair, true native BLEND and 6 render views [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int10-r1-human-views-repair-20261106
          fi
      - name: Save diagnostic failure separately; do not mark art accepted
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/debug"
          for file in INT10_R1_NATIVE_AUTHOR.log INDEPENDENT.log INT10_R1_TRUE_EDIT_NOT_ART.json; do
            test -f "$ROOT/native/$file" && cp "$ROOT/native/$file" "$ROOT/debug/" || true
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/debug/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT10-R1: truthful failure diagnostics, no ART approval [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int10-r1-human-views-repair-20261106
          fi
      - name: Short-lived raw full-resolution scenes and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT10-R1-CITY-HUMAN-VIEWS-NATIVE-EVIDENCE
          path: studies/M3D-1S/J7/R33-S27/INT10_R1/native/
          retention-days: 5
          if-no-files-found: warn
