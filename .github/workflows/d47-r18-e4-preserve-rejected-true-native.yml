name: HALO9 R18 E4 preserve true rejected native art
on:
  push:
    branches:
      - research/r33-s27-d47-r18-e4-chiral-civic-nave-20261031
    paths:
      - '.github/workflows/d47-r18-e4-preserve-rejected-true-native.yml'
permissions:
  contents: write
  actions: read
jobs:
  preserve-true-e4-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download original research native evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 41078220711
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: HALO9-D47-R18-E4-REAL-BLEND-GLB-FIVE-CAMERAS
          path: /tmp/e4
      - name: SHA256 archive original true native art rejected model
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          p=Path('/tmp/e4')
          man=json.loads((p/'R18_E4_G0_MANIFEST.json').read_text())
          assert man['art_status']=='AWAITING_TRUE_5_CAMERA_REVIEW'
          assert not man['formal_art_adopted'] and not man['minecraft_write']
          names=[man['files']['blend'],man['files']['glb'],'R18_E4_G0_MANIFEST.json','R18_E4_G0_INDEPENDENT_REOPEN_AUDIT.json']+man['files']['cameras']
          assert len(names)==9 and all((p/n).stat().st_size>100 for n in names)
          qa=json.loads((p/'R18_E4_G0_INDEPENDENT_REOPEN_AUDIT.json').read_text())
          assert qa['SOURCE_TECH']=='LIMITED_PASS'
          out=Path('studies/M3D-1S/J7/R33-S27/D47_R18_E4_EVIDENCE')
          out.mkdir(parents=True,exist_ok=True)
          zpath=out/'R18_E4_G0_TRUE_NATIVE_FIVE_VIEW_ART_REJECT.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for n in names:z.write(p/n,n)
          report={'art':'REJECT','original_run':41078220711,'original_artifact':12988706049,
            'function_certified':False,'formally_adopted':False,'minecraft_write':False,
            'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
            'members_sha256':{n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names}}
          (out/'R18_E4_G0_EVIDENCE_HASHES.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Non-force commit only to isolated research branch
        env:
          TARGET: research/r33-s27-d47-r18-e4-chiral-civic-nave-20261031
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET"
          git config user.name "halo9-research-archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R33-S27/D47_R18_E4_EVIDENCE/
          git diff --cached --quiet && exit 0
          git commit -m "E4 archive genuine rejected BLEND GLB five views"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET"
            git rebase "origin/$TARGET" || exit 1
            if git push origin "HEAD:refs/heads/$TARGET"; then exit 0; fi
            sleep 2
          done
          exit 1
