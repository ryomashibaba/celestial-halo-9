name: HALO9 LCS2-R3 inhabited fault civic void native Blender study
on:
  push:
    branches:
      - research/r33-s27-d48-lcs2-r3-inhabited-fault-city-20261105
    paths:
      - studies/M3D-1S/J7/R33-S27/LCS2_R3/author_inhabited_fault_city.py
      - .github/workflows/halo9-lcs2-r3-real-inhabited-fault.yml
permissions:
  contents: write
concurrency:
  group: halo9-lcs2-r3-occupied-fault
  cancel-in-progress: false
jobs:
  native_inhabited_fault:
    if: github.ref == 'refs/heads/research/r33-s27-d48-lcs2-r3-inhabited-fault-city-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/LCS2_R3
      SOURCE: studies/M3D-1S/J7/R33-S27/LCS2_R2/evidence/LCS2_R2_ARCHITECTURAL_SECTION.blend.gz
      SHA: 3ef9ea7e97d3b7008372db3bc39656c1c207dc0ea5804c5a1df20c7e4260d243
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify immutable research BLEND and compile actual sculpt
        run: |
          set -euo pipefail
          test -s "$SOURCE"
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" >/tmp/LCS2_R3_SOURCE.blend
          printf '%s  %s\n' "$SHA" /tmp/LCS2_R3_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_inhabited_fault_city.py"
      - name: Install exact official Blender 5.2.1 with SHA256 verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9blender
          cd /tmp/halo9blender
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o checksum
          grep -F 'blender-5.2.1-linux-x64.tar.xz' checksum | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Author real geometry and render three original viewpoints
        run: |
          set -euo pipefail
          B=/tmp/halo9blender/blender-5.2.1-linux-x64/blender
          timeout 1340s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/LCS2_R3_SOURCE.blend --python "$ROOT/author_inhabited_fault_city.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/BLENDER_AUTHOR.log"
          grep -F 'R3_NATIVE_REAL_COMPLETE' "$ROOT/native/BLENDER_AUTHOR.log"
          test -s "$ROOT/native/LCS2_R3_INHABITED_FAULT_CITY_WORKING.blend"
      - name: Independent true BLEND reopen and PNG SHA verification
        run: |
          set -euo pipefail
          cat >/tmp/r3_verify.py <<'PY'
          import bpy,json,hashlib,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          r=json.loads((p.parent/'R3_AUTHOR_REPORT.json').read_text())
          assert p.name=='LCS2_R3_INHABITED_FAULT_CITY_WORKING.blend'
          assert r['output_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert s['CONSTRUCTION']=='HOLD' and s['FORMAL_ART_ACCEPTED']==0 and s['COMPLETED_TARGETS']==0
          assert s['R3_SOURCE_SHA256']=='3ef9ea7e97d3b7008372db3bc39656c1c207dc0ea5804c5a1df20c7e4260d243'
          assert r['removed_rejected']>=28 and r['authored_meshes']>=50
          assert len(r['carved_public_voids'])==6
          for n in ('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL'):
            f=p.parent/'renders'/(n+'.png')
            assert bpy.data.objects[n].type=='CAMERA'
            with f.open('rb') as x:head=x.read(24)
            assert head[:8]==bytes.fromhex('89504e470d0a1a0a')
            assert struct.unpack('>II',head[16:24])==(1100,825)
            assert hashlib.sha256(f.read_bytes()).hexdigest()==r['image_sha256'][n]
          print('R3_INDEPENDENT_BLENDER_TECH_PASS',r['output_sha256'],flush=True)
          PY
          /tmp/halo9blender/blender-5.2.1-linux-x64/blender --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/LCS2_R3_INHABITED_FAULT_CITY_WORKING.blend" --python /tmp/r3_verify.py \
            2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'R3_INDEPENDENT_BLENDER_TECH_PASS' "$ROOT/native/INDEPENDENT.log"
      - name: Persist authentic BLEND source and 3-view image without art adoption
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import os,gzip,hashlib,json,base64
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat
          root=Path(os.environ['ROOT']);n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          blend=n/'LCS2_R3_INHABITED_FAULT_CITY_WORKING.blend'
          with blend.open('rb') as f,gzip.open(e/(blend.name+'.gz'),'wb',compresslevel=6) as g:
            while chunk:=f.read(1048576):g.write(chunk)
          names=['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']
          sheet=Image.new('RGB',(1650,445),(229,231,227));d=ImageDraw.Draw(sheet)
          brightness={}
          for i,name in enumerate(names):
            img=Image.open(n/'renders'/(name+'.png')).convert('RGB')
            brightness[name]=round(sum(ImageStat.Stat(img).mean)/3,2)
            img.thumbnail((550,413),Image.Resampling.LANCZOS)
            sheet.paste(img,(i*550,30));d.text((i*550+7,7),name,fill=(0,0,0))
          jpg=e/'R3_TRUE_THREE_VIEW_AWAIT_ART.jpg';sheet.save(jpg,quality=83,optimize=True)
          (e/'R3_REVIEW_JPEG_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          r=json.loads((n/'R3_AUTHOR_REPORT.json').read_text())
          r['image_brightness']=brightness
          r['review_jpg_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          r['image_preflight']='VALID_CANDIDATE' if all(x>10 for x in brightness.values()) else 'IMAGE_INVALID'
          r['art']='AWAIT_DIRECT_IMAGE_JUDGMENT_NOT_ADOPTED'
          (e/'R3_TECH_NOT_ART.json').write_text(json.dumps(r,indent=2))
          print('R3_IMAGE_READY',brightness,r['image_preflight'],flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence"
          if ! git diff --cached --quiet; then
            git commit -m 'LCS2 R3: isolate genuine carved civic fault city and native image proof [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-lcs2-r3-inhabited-fault-city-20261105
          fi
      - name: Temporary raw PNG and editable BLEND backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-LCS2-R3-NATIVE-ART-CANDIDATE
          path: studies/M3D-1S/J7/R33-S27/LCS2_R3/native/
          retention-days: 7
          if-no-files-found: warn
