name: HALO9 INT1 interior-first truly inhabited city — isolated Blender study
on:
  push:
    branches:
      - research/r33-s27-d48-int1-civic-interior-first-20261106
    paths:
      - studies/M3D-1S/J7/R33-S27/INT1/author.py.bz2.b64
      - .github/workflows/halo9-int1-interior-first-true-blender.yml
permissions:
  contents: write
concurrency:
  group: halo9-int1-interior-first-20261106
  cancel-in-progress: false
jobs:
  native_interiors:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int1-civic-interior-first-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT1
      ORIGINAL: studies/M3D-1S/J7/R33-S27/LCS2_R3/evidence/LCS2_R3_INHABITED_FAULT_CITY_WORKING.blend.gz
      ORIGINAL_SHA: f4f9f560bd35a3b2a4255aef52d4f52201e28a9a9d8530f5507f6ad8d4e1d703
      AUTHOR_SHA: f874f74d6f691a687eb4126989cc29a35a00d9b49880afa54c6a74b5e215229c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify frozen scene and full source code before all edits
        run: |
          set -euo pipefail
          test -s "$ORIGINAL"
          mkdir -p "$ROOT/native"
          gzip -dc "$ORIGINAL" > /tmp/INT1_SOURCE.blend
          printf '%s  %s\n' "$ORIGINAL_SHA" /tmp/INT1_SOURCE.blend | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import base64,bz2,os,hashlib,py_compile
          root=Path(os.environ['ROOT'])
          raw=bz2.decompress(base64.b64decode((root/'author.py.bz2.b64').read_text().strip()))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==os.environ['AUTHOR_SHA'],digest
          f=root/'author_interiors.py'
          f.write_bytes(raw)
          py_compile.compile(str(f),doraise=True)
          print('INT1_FULL_AUTHOR_SOURCE_VERIFIED',digest,len(raw),flush=True)
          PY
      - name: Acquire official Blender 5.2.1 with distributor SHA256 validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-blender
          cd /tmp/halo9-blender
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o checksums
          grep -F 'blender-5.2.1-linux-x64.tar.xz' checksums | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Author actual occupied public interiors and render three protected cameras
        run: |
          set -euo pipefail
          B=/tmp/halo9-blender/blender-5.2.1-linux-x64/blender
          timeout 1680s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT1_SOURCE.blend --python "$ROOT/author_interiors.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/BLENDER_AUTHOR.log"
          grep -F 'INT1_TRUE_NATIVE_COMPLETE' "$ROOT/native/BLENDER_AUTHOR.log"
          test -s "$ROOT/native/HALO9_INT1_LIVED_CIVIC_ARCHITECTURE.blend"
      - name: Independently reopen actual BLEND and verify saved rendered PNGs
        run: |
          set -euo pipefail
          cat > /tmp/halo9_verify_int1.py <<'PY'
          import bpy,hashlib,json,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          r=json.loads((p.parent/'INT1_SOURCE_AND_NATIVE_REPORT.json').read_text())
          assert p.name=='HALO9_INT1_LIVED_CIVIC_ARCHITECTURE.blend'
          assert r['working_blend_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert s['INT1_SOURCE_SHA256']=='f4f9f560bd35a3b2a4255aef52d4f52201e28a9a9d8530f5507f6ad8d4e1d703'
          assert s['CONSTRUCTION']=='HOLD' and s['COMPLETED_TARGETS']==0 and s['FORMAL_ART_ACCEPTED']==0
          assert r['formal_art_adopted']==0 and r['completed_targets']==0
          assert r['minecraft_construction']=='HOLD'
          assert r['removed_rejected_objects']>300 and r['new_meshes']>500
          assert r['cameras_unmodified'] is True
          for name in ['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']:
              assert bpy.data.objects[name].type=='CAMERA'
              f=p.parent/'renders'/(name+'.png')
              with f.open('rb') as src:head=src.read(24)
              assert head[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',head[16:24])==(1100,825)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['render_sha256'][name]
          print('INT1_INDEPENDENT_NATIVE_TECH_PASS',r['working_blend_sha256'],flush=True)
          PY
          /tmp/halo9-blender/blender-5.2.1-linux-x64/blender --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT1_LIVED_CIVIC_ARCHITECTURE.blend" --python /tmp/halo9_verify_int1.py \
            2>&1 | tee "$ROOT/native/INDEPENDENT_REOPEN.log"
          grep -F 'INT1_INDEPENDENT_NATIVE_TECH_PASS' "$ROOT/native/INDEPENDENT_REOPEN.log"
      - name: Archive real BLEND, real screenshots and human-review mosaic in isolation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import os,gzip,hashlib,json,base64
          from pathlib import Path
          from PIL import Image,ImageStat,ImageDraw
          root=Path(os.environ['ROOT']);n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          p=n/'HALO9_INT1_LIVED_CIVIC_ARCHITECTURE.blend'
          with p.open('rb') as f,gzip.open(e/(p.name+'.gz'),'wb',compresslevel=6) as g:
              while chunk:=f.read(1048576):g.write(chunk)
          names=['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']
          image=Image.new('RGB',(1650,445),(226,227,222));draw=ImageDraw.Draw(image);brightness={}
          for i,name in enumerate(names):
              src=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(src).mean)/3,2)
              src.thumbnail((550,412),Image.Resampling.LANCZOS)
              image.paste(src,(i*550,30))
              draw.text((i*550+10,8),name,fill=(0,0,0))
          jpg=e/'INT1_TRUE_THREE_VIEW_UNREVIEWED.jpg'
          image.save(jpg,quality=82,optimize=True)
          (e/'INT1_TRUE_THREE_VIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          report=json.loads((n/'INT1_SOURCE_AND_NATIVE_REPORT.json').read_text())
          report['true_render_mean_brightness']=brightness
          report['image_preflight']='VALID_CANDIDATE' if all(x>10 for x in brightness.values()) else 'IMAGE_INVALID'
          report['mosaic_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          report['formal_art_adopted']=0
          report['art']='UNREVIEWED_NOT_ADOPTED'
          (e/'INT1_TECH_NOT_ART.json').write_text(json.dumps(report,indent=2))
          print('INT1_GENUINE_IMAGES_PRESERVED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/author_interiors.py" "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT1: preserve true editable interior-first 3D and unreviewed render evidence [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int1-civic-interior-first-20261106
          fi
      - name: Temporary raw full-size renders and BLEND
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT1-TRUE-NATIVE-BLEND-PNG-AND-LOGS
          path: studies/M3D-1S/J7/R33-S27/INT1/native/
          retention-days: 7
          if-no-files-found: warn
