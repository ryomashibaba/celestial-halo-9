name: HALO9 R18 E2 persist actual rejected BLEND GLB and 4 art gate images
on:
  push:
    branches:
      - research/r33-s27-d47-r18-e2-inhabited-void-20261030
    paths:
      - '.github/workflows/d47-r18-e2-preserve-actual-art-reject.yml'
permissions:
  contents: write
  actions: read
jobs:
  preserve-original-art-reject-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41069377264
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: HALO9-R18-E2-NEW-GENUINE-CIVIC-4VIEWS-BLEND-GLB
          path: /tmp/e2-original
      - name: Verify and preserve original rejected native model with SHA evidence
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          p=Path('/tmp/e2-original')
          j=json.loads((p/'R18_E2_G0_MANIFEST.json').read_text())
          assert j['mesh_count']==35 and j['triangles']==1912
          assert j['formal_art_approved'] is False and j['minecraft_write'] is False
          names=[j['files']['blend'],j['files']['glb'],
            'R18_E2_G0_MANIFEST.json','R18_E2_INDEPENDENT_SOURCE_AUDIT.json']
          names+=j['files']['cameras']
          assert len(names)==8
          assert all((p/n).is_file() and (p/n).stat().st_size>100 for n in names)
          o=Path('studies/M3D-1S/J7/R33-S27/D47_R18_E2_EVIDENCE')
          o.mkdir(parents=True,exist_ok=True)
          z=o/'R18_E2_G0_TRUE_BLENDER_FOUR_VIEW_ART_REJECT_SOURCE.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as f:
            for n in names:f.write(p/n,arcname=n)
          check={
            'source_workflow':41069377264,'source_artifact_id':12984312516,
            'archive_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),
            'files_sha256':{n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names},
            'source_technical':'LIMITED_PASS','visual_art':'REJECT',
            'function':'UNCERTIFIED','official_adoption':False,
            'city_master_complete':False,'minecraft_write':False
          }
          (o/'R18_E2_G0_TRUE_ART_REJECT_SOURCE_HASHES.json').write_text(json.dumps(check,indent=2))
          print('R18_E2_REJECTED_NATIVE_ARCHIVE',check['archive_sha256'])
          PY
      - name: Commit unchanged real evidence ONLY into E2 isolated research branch, no force push
        env:
          TARGET: research/r33-s27-d47-r18-e2-inhabited-void-20261030
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET"
          git config user.name 'halo9-r18-e2-art-evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/M3D-1S/J7/R33-S27/D47_R18_E2_EVIDENCE/
          git diff --cached --quiet && exit 0
          git commit -m 'R18 E2 store real rejected native BLEND GLB and four images; not adopted'
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET"
            git rebase "origin/$TARGET" || exit 1
            if git push origin "HEAD:refs/heads/$TARGET"; then exit 0; fi
            sleep 2
          done
          exit 1
