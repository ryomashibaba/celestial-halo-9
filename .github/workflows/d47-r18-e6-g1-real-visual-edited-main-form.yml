          xvfb-run -a python studies/M3D-1S/J7/R33-S27/D47_R18_E6_NATIVE/e6_edit_same_native_fold_after_review.py \
            /tmp/e6-original /tmp/e6-edited \
            studies/M3D-1S/J7/R33-S27/D47_R18_E6_REVIEW/E6_G0_TRUE_5VIEW_VISUAL_DECISION.json
      - name: Independently verify original camera matching and BLEND GLB reopen
