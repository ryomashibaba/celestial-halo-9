name: J7-R9 spatial-program-first real Blender model and visual audit
on:
  push:
    branches: [research/m3d1s-j7-r9-urban-section-first-20261024]
    paths:
      - .github/workflows/halo9-j7-r9-civic-urban-section.yml
      - studies/M3D-1S/J7/R9/build_tennu_blender.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender-r9-urban-section:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Install genuine Blender and glTF prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb python3-numpy libgl1-mesa-dri
          blender --version | head -3
      - name: Produce architectural model, measure civic route and render 11 real Blender views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf studies/M3D-1S/J7/R9/outputs
          mkdir -p studies/M3D-1S/J7/R9/outputs
          xvfb-run -a blender --background --factory-startup --python-exit-code 23 --python studies/M3D-1S/J7/R9/build_tennu_blender.py -- studies/M3D-1S/J7/R9/outputs
          test -s studies/M3D-1S/J7/R9/outputs/J7R9_TENNU_URBAN_SEAM.blend
          test -s studies/M3D-1S/J7/R9/outputs/J7R9_TENNU_URBAN_SEAM.glb
          test -s studies/M3D-1S/J7/R9/outputs/J7R9_BLENDER_SPATIAL_EVIDENCE.json
          test "$(find studies/M3D-1S/J7/R9/outputs -name '*.png' | wc -l)" -eq 11
      - name: Preserve complete research output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo9-j7r9-tennu-urban-section
          path: studies/M3D-1S/J7/R9/outputs
          if-no-files-found: warn
      - name: Commit native 3D and renders only to R9 research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R9/outputs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] J7-R9: Blender civic urban section and 11-view art research evidence"
          # Avoid concurrent branch changes causing non-fast-forward (research report commits).
          # Rebase only this disposable checkout and never force-push protected history.
          git fetch origin research/m3d1s-j7-r9-urban-section-first-20261024
          git rebase FETCH_HEAD
          git push origin HEAD:research/m3d1s-j7-r9-urban-section-first-20261024
