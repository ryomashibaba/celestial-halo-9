name: HALO9 D48 R3 G1 original BLEND art sculpt true seven-view inspection
on:
  push:
    branches:
      - research/r33-s27-d48-r3-visual-mesh-art-session-20261031
    paths:
      - '.github/workflows/d48-r3-g1-image-guided-native-sculpt.yml'
      - 'studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_direct_roof_sculpt.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: halo9-d48-r3-original-art-sculpt
  cancel-in-progress: true
jobs:
  original-native-and-fixed-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Safe source and constitution-scope preflight
        run: |
          python -m py_compile studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_direct_roof_sculpt.py
          python studies/M3D-1S/J7/R33-S27/D48_MACRO_CITY_MASTER/validate_d48_r0.py
      - name: Retrieve the exact P2 G2 real source Blender model
        uses: actions/download-artifact@v4
        with:
          name: HALO9-D48-R2-P2-TWO-DIRECT-EDITED-BLENDS-14-REAL-IMAGES
          run-id: 41141480988
          github-token: ${{ github.token }}
          path: /tmp/halo9-p2-saved-real-source
      - name: Install actual Blender 4.5.15
        run: |
          python -m pip install 'bpy==4.5.15' 'Pillow>=10'
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxrender1 libxkbcommon0 libxi6 libxrandr2 xvfb
      - name: Open actual rejected native BLEND and sculpt six existing meshes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_direct_roof_sculpt.py /tmp/halo9-p2-saved-real-source /tmp/halo9-r3-g1
      - name: Independently verify 6 visible true nonrigid edits, all 7 fixed cameras, native reopen and GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          import bpy,hashlib,json
          from PIL import Image,ImageChops
          root=Path('/tmp/halo9-r3-g1')
          m=json.loads((root/'R3_G1_NATIVE_SCULPT_AUDIT.json').read_text())
          assert m['schema']=='D48_R3_G1_SAVED_G2_NATIVE_DIRECT_NONRIGID_SCULPT'
          assert m['source_blend_sha256']=='939e86905b0fa51456af9d5824e41962ee0e8ffa9213616b16c68a2b87614f3f'
          assert m['nontarget_meshes_unchanged'] is True
          assert m['original_camera_matrices_unchanged'] is True
          assert len(m['sculpted_existing_meshes'])==m['native_editable_shape_keys']==m['real_boolean_skylights']==6
          assert sorted(m['changed_existing_meshes'])==sorted(m['sculpted_existing_meshes'])
          assert len(m['camera_names'])==7
          assert m['art']=='UNREVIEWED_PENDING_ACTUAL_IMAGES'
          for filename,sha in m['sha256'].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==sha,filename
          original=Path('/tmp/halo9-p2-saved-real-source/G2_REJECTED_OUTER_MASS_REMOVED')
          changed={}
          for name in m['camera_names']:
              with Image.open(root/(name+'.png')) as im,Image.open(original/(name+'.png')) as before:
                  a=im.convert('RGB');b=before.convert('RGB')
                  assert a.size==b.size==(1360,800)
                  hist=ImageChops.difference(a,b).convert('L').histogram()
                  changed[name]=round(1-hist[0]/(1360*800),6)
          assert max(changed.values())>.002,changed
          bpy.ops.wm.open_mainfile(filepath=str(root/m['file_names']['blend']))
          assert bpy.context.scene['D48_CITY_MASTER_COMPLETE'] is False
          assert bpy.context.scene['D48_FORMAL_ADOPTED'] is False
          assert bpy.context.scene['D48_MINECRAFT_WRITTEN'] is False
          assert bpy.context.scene['D48_OFFICIAL_COORDINATES'] is False
          assert len([o for o in bpy.data.objects if o.type=='CAMERA'])==7
          for name in m['sculpted_existing_meshes']:
              ob=bpy.data.objects[name]
              assert ob.type=='MESH' and ob['R3_GEOMETRICALLY_CARVED_SKYLIGHT'] is True
              assert ob['R3_SCULPTED_VERTEX_COUNT']>=50
              assert ob.data.shape_keys is not None
              assert len(ob.data.shape_keys.key_blocks)==2
              assert ob.data.shape_keys.key_blocks[1].value==1
          assert len([o for o in bpy.data.objects if o.type=='MESH'])==m['original_mesh_count']
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=str(root/m['file_names']['glb']))
          assert len([o for o in bpy.data.objects if o.type=='MESH'])>=m['original_mesh_count']
          audit={'true_native_reopen':'LIMITED_PASS','original_non_target_objects_unchanged':True,
            'fixed_camera_change_fraction':changed,'art':'UNREVIEWED',
            'function':'UNCERTIFIED','formal_adoption':False,'minecraft_write':False}
          (root/'R3_G1_INDEPENDENT_REOPEN_QA.json').write_text(json.dumps(audit,indent=2))
          print('R3_G1_REAL_SAVED_NATIVE_SCULPT_TECH_PASS',changed)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HALO9-D48-R3-G1-TRUE-NATIVE-SCULPT-7-VIEW-REVIEW
          path: /tmp/halo9-r3-g1/
          retention-days: 14
          if-no-files-found: warn
