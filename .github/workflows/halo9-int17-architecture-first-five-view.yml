name: HALO9 INT17 architecture-first native urban section five-view ART review
on:
  push:
    branches:
      - research/r33-s27-int17-urban-architecture-first-20261106
    paths:
      - .github/workflows/halo9-int17-architecture-first-five-view.yml
      - studies/M3D-1S/J7/R33-S27/INT17/author_architecture_first_city_section.py
permissions:
  contents: write
concurrency:
  group: halo9-int17-architecture-first-20261106
  cancel-in-progress: false
jobs:
  actual_architecture_first_city_copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT17
      PARENT: studies/M3D-1S/J7/R33-S27/INT15/evidence/HALO9_INT15_H1_OCCUPIED_LIFT_PUBLIC_CORE.blend.gz
      SHA: e996fab613904dc557638612d4380ba67ef5c6bbd4aa9fb219d9aeaa8f511fb9
    steps:
      - uses: actions/checkout@v4
      - name: Check protected input, research branch, and author script
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/research/r33-s27-int17-urban-architecture-first-20261106'
          python3 -m py_compile "$ROOT/author_architecture_first_city_section.py"
          gzip -dc "$PARENT" > /tmp/INT17_SOURCE.blend
          printf '%s  %s\n' "$SHA" /tmp/INT17_SOURCE.blend | sha256sum -c -
          echo INT17_VERIFIED_PARENT_NOT_ART
      - name: Download and verify official Blender 5.2.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/h17-blender && cd /tmp/h17-blender
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o official_sums
          sed -n '/blender-5.2.1-linux-x64.tar.xz/p' official_sums | sed 's/blender-5.2.1-linux-x64.tar.xz$/blender.tar.xz/' | sha256sum -c -
          tar -xf blender.tar.xz
      - name: Directly author native 3D inhabited central section and render fixed E11
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-int17
          timeout 1400s /tmp/h17-blender/blender-5.2.1-linux-x64/blender --background --threads 2 --python-exit-code 96 \
              /tmp/INT17_SOURCE.blend --python "$ROOT/author_architecture_first_city_section.py" \
              -- --output /tmp/halo9-int17 2>&1 | tee /tmp/halo9-int17/AUTHOR.log
          grep -F INT17_TRUE_EDITABLE_ARCHITECTURAL_SCENE_COMPLETE_PENDING_ART /tmp/halo9-int17/AUTHOR.log
      - name: Independently inspect re-opened native scene and image hashes
        run: |
          set -euo pipefail
          cat > /tmp/halo9-int17/recheck.py <<'PY'
          import bpy,json,hashlib
          from pathlib import Path
          sc=bpy.context.scene
          base=Path('/tmp/halo9-int17')
          d=json.loads((base/'INT17_NATIVE_EVIDENCE_NOT_ART.json').read_text())
          assert sc['INT17_STATUS']=='UNREVIEWED_NOT_ADOPTED'
          assert sc['FORMAL_ART_ACCEPTED']==sc['COMPLETED_TARGETS']==0
          assert sc['CONSTRUCTION']=='HOLD'
          assert len(d['new_native_3d_components'])>=20
          for n in d['new_native_3d_components']:
              ob=bpy.data.objects.get(n)
              assert ob is not None and ob.type=='MESH' and len(ob.data.polygons)>=5,n
          for n,sha in d['render_sha256'].items():
              assert hashlib.sha256((base/'renders'/(n+'.png')).read_bytes()).hexdigest()==sha,n
          assert all(n in bpy.data.objects for n in
              ('W0_NORTH_FRACTURED_RANGE','W0_WEST_BASALT_ESCARPMENT',
               'W0_GROUND_BASIN','W0_EASTERN_ARTIFICIAL_SEA',
               'E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL'))
          print('INT17_REOPEN_NATIVE_CITY_5_REAL_IMAGES_PASS_NOT_ART',flush=True)
          PY
          /tmp/h17-blender/blender-5.2.1-linux-x64/blender --background --threads 2 --python-exit-code 95 \
            /tmp/halo9-int17/HALO9_INT17_ARCHITECTURE_FIRST_RESEARCH.blend \
            --python /tmp/halo9-int17/recheck.py 2>&1 | tee /tmp/halo9-int17/RECHECK.log
          grep -F INT17_REOPEN_NATIVE_CITY_5_REAL_IMAGES_PASS_NOT_ART /tmp/halo9-int17/RECHECK.log
      - name: Archive small actual 3D and view sheet in research branch only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import json,gzip,hashlib,os
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path(os.environ['ROOT']);out=root/'evidence';out.mkdir(parents=True,exist_ok=True)
          tmp=Path('/tmp/halo9-int17')
          blend=tmp/'HALO9_INT17_ARCHITECTURE_FIRST_RESEARCH.blend'
          with blend.open('rb') as f,gzip.open(out/(blend.name+'.gz'),'wb',compresslevel=6) as g:
              while c:=f.read(1048576):g.write(c)
          names=('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL',
                 'INT17_NEW_ARCHITECTURAL_W0_CITY_AERIAL','INT17_NEW_H1_LIVED_STREET')
          sheet=Image.new('RGB',(1650,900),(218,220,220));pen=ImageDraw.Draw(sheet)
          for i,name in enumerate(names):
              pic=Image.open(tmp/'renders'/(name+'.png')).convert('RGB')
              pic.thumbnail((550,410),Image.Resampling.LANCZOS)
              x=i%3*550;y=i//3*450
              sheet.paste(pic,(x,y+25))
              pen.text((x+6,y+7),name,fill=(10,10,10))
          jpg=out/'INT17_FIVE_NATIVE_VIEWS_UNREVIEWED.jpg';sheet.save(jpg,quality=88,optimize=True)
          d=json.loads((tmp/'INT17_NATIVE_EVIDENCE_NOT_ART.json').read_text())
          d['sheet_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          d['independent_blender_reopen']='PASS'
          d['art']='UNREVIEWED_NOT_ADOPTED'
          (out/'INT17_INDEPENDENT_TECH_NOT_ART.json').write_text(json.dumps(d,indent=2))
          print('INT17_EDITABLE_SOURCE_AND_TRUE_FIVE_IMAGES_SAVED_RESEARCH_ONLY',flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT17: preserve actual architecture-first research BLEND and five native unreviewed views [skip ci]'
            git fetch origin research/r33-s27-int17-urban-architecture-first-20261106
            git rebase origin/research/r33-s27-int17-urban-architecture-first-20261106
            git push origin HEAD:refs/heads/research/r33-s27-int17-urban-architecture-first-20261106
          fi
