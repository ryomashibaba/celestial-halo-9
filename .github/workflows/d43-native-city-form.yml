name: HALO-9 D43 Genuine Blender Native Visual City Sculpt (research only)
on:
  push:
    branches:
      - research/r33-s27-d43-native-city-form-20261029
    paths:
      - 'studies/M3D-1S/J7/R33-S27/D43_NATIVE/**'
      - '.github/workflows/d43-native-city-form.yml'
permissions:
  contents: read
jobs:
  native-city-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.11 (bpy 4.5 LTS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real native Blender 4.5.15 Python module
        run: python -m pip install 'bpy==4.5.15'
      - name: Create editable BLEND + real GLB and 8 fixed Blender renders
        run: python studies/M3D-1S/J7/R33-S27/D43_NATIVE/d43_base.py /tmp/halo9-d43-native
      - name: Reopen saved native BLEND and reimport GLB in independent bpy process
        run: python studies/M3D-1S/J7/R33-S27/D43_NATIVE/d43_reopen.py /tmp/halo9-d43-native
      - name: Upload genuine Blender baseline for AI visual review (not artistic approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-D43-NATIVE-BASE-NOT-ART-APPROVED
          path: /tmp/halo9-d43-native/
          if-no-files-found: warn
          retention-days: 7
