name: HALO9 INT12 original-E11 screen-directed native Blender GUI sculpt
on:
  push:
    branches:
      - research/r33-s27-d48-int12-screen-directed-sculpt-20261106
    paths:
      - .github/workflows/halo9-int12-e11-gui-direct-sculpt.yml
      - studies/M3D-1S/J7/R33-S27/INT12/gui_screen_sculpt.py
      - studies/M3D-1S/J7/R33-S27/INT12/render_independent.py
permissions:
  contents: write
concurrency:
  group: halo9-int12-screen-directed-20261106
  cancel-in-progress: false
jobs:
  screen_sculpt:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int12-screen-directed-sculpt-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT12
      SOURCE: studies/M3D-1S/J7/R33-S27/INT11/evidence/HALO9_INT11_HOLLOW_ARCHIPELAGO_CIVIC_CITY.blend.gz
      SOURCE_SHA: 2ec37b65868509060a499e9c648c3030aa3d008a7a9f603a2598dc4358b2140e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Exact research BLEND source verification and Python syntax
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" >/tmp/INT12_SOURCE.blend
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/INT12_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/gui_screen_sculpt.py" "$ROOT/render_independent.py"
          echo INT12_PROTECTED_INPUT_AND_CODE_VERIFIED
      - name: Install real virtual Blender GUI desktop and image library
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11-utils openbox xdotool scrot python3-pil libgl1-mesa-dri
      - name: Download official SHA256-verified Blender 5.2.1 LTS
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-blender-int12 && cd /tmp/halo9-blender-int12
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o sums
          sed -n '/blender-5.2.1-linux-x64.tar.xz/p' sums | sed 's/blender-5.2.1-linux-x64.tar.xz$/blender.tar.xz/' | sha256sum -c -
          tar -xf blender.tar.xz
      - name: Real onscreen Blender viewport fixed E11 screenshot and native in-place sculpt editing
        run: |
          set -euo pipefail
          OUT=/tmp/halo9-int12
          mkdir -p "$OUT"
          export DISPLAY=:94 LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :94 -screen 0 1600x1000x24 +extension GLX -nolisten tcp > "$OUT/XVFB.log" 2>&1 &
          XVFB_PID=$!
          for i in $(seq 1 25); do xdpyinfo -display :94 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :94 >/dev/null
          openbox > "$OUT/OPENBOX.log" 2>&1 &
          B=/tmp/halo9-blender-int12/blender-5.2.1-linux-x64/blender
          timeout 540s "$B" --window-geometry 0 0 1520 930 --threads 2 --python-exit-code 97 \
            /tmp/INT12_SOURCE.blend --python "$ROOT/gui_screen_sculpt.py" \
            > "$OUT/BLENDER_GUI_AUTHOR.log" 2>&1 &
          PID=$!
          ready=0
          for i in $(seq 1 95); do
            if test -s "$OUT/GUI_READY.json"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              tail -90 "$OUT/BLENDER_GUI_AUTHOR.log"; exit 31
            fi
            sleep 1
          done
          if test "$ready" -ne 1; then tail -90 "$OUT/BLENDER_GUI_AUTHOR.log"; exit 32; fi
          WID=$(xdotool search --onlyvisible --class blender | head -n 1)
          test -n "$WID"
          xdotool windowactivate --sync "$WID"
          sleep 2
          # Previous actual GUI image proved the Blender Quick Setup overlay.
          xdotool mousemove --sync 795 710
          xdotool click 1
          sleep 2
          xdotool key --clearmodifiers Escape
          sleep 2
          scrot -o "$OUT/BEFORE_REAL_GUI.png"
          touch "$OUT/BEGIN_EDIT"
          done=0
          for i in $(seq 1 100); do
            if test -s "$OUT/GUI_AUTHOR_SUCCESS.json"; then done=1; break; fi
            if test -s "$OUT/GUI_AUTHOR_FAILURE.json"; then
              cat "$OUT/GUI_AUTHOR_FAILURE.json"; exit 33
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              tail -90 "$OUT/BLENDER_GUI_AUTHOR.log"; exit 34
            fi
            sleep 1
          done
          if test "$done" -ne 1; then tail -90 "$OUT/BLENDER_GUI_AUTHOR.log"; exit 35; fi
          sleep 3
          scrot -o "$OUT/AFTER_REAL_GUI.png"
          cat "$OUT/GUI_AUTHOR_SUCCESS.json"
          cp "$OUT/"*.json "$ROOT/native/"
          cp "$OUT/"*.png "$ROOT/native/"
          cp "$OUT/BLENDER_GUI_AUTHOR.log" "$ROOT/native/"
          cp "$OUT/HALO9_INT12_E11_SCREEN_DIRECT_NATIVE_RESCULPT.blend" "$ROOT/native/"
          kill "$PID" || true
          kill "$XVFB_PID" || true
          echo INT12_TRUE_GUI_SAME_NATIVE_3D_EDIT_SAVED
      - name: Independent Blender reopen, original W0/E11 proof, real six fixed-and-additional images
        run: |
          set -euo pipefail
          B=/tmp/halo9-blender-int12/blender-5.2.1-linux-x64/blender
          timeout 1200s "$B" --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT12_E11_SCREEN_DIRECT_NATIVE_RESCULPT.blend" \
            --python "$ROOT/render_independent.py" \
            2>&1 | tee "$ROOT/native/INDEPENDENT_RENDER.log"
          grep -F 'INT12_INDEPENDENT_E11_3D_AND_SIX_RENDERS_VERIFIED_NOT_ART' "$ROOT/native/INDEPENDENT_RENDER.log"
          cp /tmp/halo9-int12/INDEPENDENT_TECH_NOT_ART.json "$ROOT/native/"
          mkdir -p "$ROOT/native/renders"
          cp /tmp/halo9-int12/renders/*.png "$ROOT/native/renders/"
      - name: Preserve editable actual Blender mesh and actual image evidence in isolated research branch only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,gzip,json,base64,hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat
          root=Path(os.environ['ROOT']);n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          blend=n/'HALO9_INT12_E11_SCREEN_DIRECT_NATIVE_RESCULPT.blend'
          with blend.open('rb') as source,gzip.open(e/(blend.name+'.gz'),'wb',compresslevel=6) as out:
              while chunk:=source.read(1048576):out.write(chunk)
          names=('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL',
                 'INT11_NAVE_HOLLOW_PUBLIC_INTERIOR',
                 'INT11_H1_CIVIC_MARKET_INTERIOR',
                 'INT11_M247C_W0_THREE_DIMENSIONAL_AERIAL')
          canvas=Image.new('RGB',(1740,914),(215,215,212))
          draw=ImageDraw.Draw(canvas);brightness={}
          for i,name in enumerate(names):
              raw=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(raw).mean)/3,2)
              raw.thumbnail((580,426),Image.Resampling.LANCZOS)
              x=(i%3)*580;y=(i//3)*457
              canvas.paste(raw,(x,y+26))
              draw.text((x+8,y+5),name,fill=(0,0,0))
          jpg=e/'INT12_TRUE_SIX_VIEW_UNREVIEWED.jpg'
          canvas.save(jpg,quality=85,optimize=True)
          (e/'INT12_TRUE_SIX_VIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          for key in ('BEFORE_REAL_GUI','AFTER_REAL_GUI'):
              original=Image.open(n/(key+'.png')).convert('RGB')
              original.thumbnail((1200,750),Image.Resampling.LANCZOS)
              original.save(e/(key+'.png'),optimize=True)
          d=json.loads((n/'INDEPENDENT_TECH_NOT_ART.json').read_text())
          d['six_view_mean_brightness']=brightness
          d['six_view_montage_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          d['art']='UNREVIEWED_NOT_ADOPTED'
          (e/'INT12_INDEPENDENT_TECH_NOT_ART.json').write_text(json.dumps(d,indent=2))
          print('INT12_NATIVE_EVIDENCE_ARCHIVED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT12: archive visual-guided edited M247-C BLEND, fixed 6 renders and true GUI before/after [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int12-screen-directed-sculpt-20261106
          fi
      - name: Preserve errors, failed screen and source logs without false success
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/debug"
          OUT=/tmp/halo9-int12
          for f in BLENDER_GUI_AUTHOR.log GUI_READY.json GUI_AUTHOR_FAILURE.json GUI_AUTHOR_SUCCESS.json; do
            test -f "$OUT/$f" && cp "$OUT/$f" "$ROOT/debug/$f" || true
          done
          for f in BEFORE_REAL_GUI.png AFTER_REAL_GUI.png; do
            test -f "$OUT/$f" && cp "$OUT/$f" "$ROOT/debug/$f" || true
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/debug/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT12: retain genuine GUI image-directed sculpt error, do not claim ART or TECH [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int12-screen-directed-sculpt-20261106
          fi
      - name: Temporary full-resolution GUI and Blender research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT12-FIXED-E11-GUI-SCREEN-SCULPT
          path: |
            /tmp/halo9-int12/
            studies/M3D-1S/J7/R33-S27/INT12/native/
          retention-days: 5
          if-no-files-found: warn
