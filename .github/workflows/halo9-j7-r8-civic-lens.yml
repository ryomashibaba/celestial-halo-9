name: J7-R8 Blender civic lens visual architecture experiment
on:
  push:
    branches: [research/m3d1s-j7-r8-civic-terraced-atrium-20261024]
    paths:
      - .github/workflows/halo9-j7-r8-civic-lens.yml
      - studies/M3D-1S/J7/R8/build_civic_lens.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-blender-civic-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research
        uses: actions/checkout@v4
      - name: Install actual Blender and required GLTF packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb python3-numpy libgl1-mesa-dri
          blender --version | head -3
      - name: Native Blender build and 9-view visual audit (fail closed)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf studies/M3D-1S/J7/R8/outputs
          mkdir -p studies/M3D-1S/J7/R8/outputs
          xvfb-run -a blender --background --factory-startup --python-exit-code 23 --python studies/M3D-1S/J7/R8/build_civic_lens.py -- studies/M3D-1S/J7/R8/outputs
          test -s studies/M3D-1S/J7/R8/outputs/J7R8_CIVIC_LENS_ART_STUDY.blend
          test -s studies/M3D-1S/J7/R8/outputs/J7R8_CIVIC_LENS_ART_STUDY.glb
          test -s studies/M3D-1S/J7/R8/outputs/J7R8_REAL_BLENDER_EVIDENCE.json
          test "$(find studies/M3D-1S/J7/R8/outputs -name '*.png' | wc -l)" -eq 9
      - name: Preserve all outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo9-j7r8-actual-blender-art
          path: studies/M3D-1S/J7/R8/outputs/
          if-no-files-found: warn
      - name: Save BLEND, GLB and rendered views to this research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R8/outputs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] J7-R8: actual Blender civic lens study with 9-view evidence"
          git push origin HEAD:research/m3d1s-j7-r8-civic-terraced-atrium-20261024
