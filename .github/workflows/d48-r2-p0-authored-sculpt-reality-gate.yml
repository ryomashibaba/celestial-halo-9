name: HALO9 D48 R2 P0 architect-authored real 3D and honest five-view art gate
on:
  push:
    branches:
      - research/r33-s27-d48-r2-architectural-sculpt-20261031
    paths:
      - '.github/workflows/d48-r2-p0-authored-sculpt-reality-gate.yml'
      - 'studies/M3D-1S/J7/R33-S27/D48_R2_SCULPT/d48_r2_sculpted_city_p0.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-native-and-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight syntax and long-term city policy scope
        run: |
          python -m py_compile studies/M3D-1S/J7/R33-S27/D48_R2_SCULPT/d48_r2_sculpted_city_p0.py
          python studies/M3D-1S/J7/R33-S27/D48_MACRO_CITY_MASTER/validate_d48_r0.py
      - name: Install actual Blender for source construction
        run: |
          python -m pip install 'bpy==4.5.15' 'Pillow>=10'
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxrender1 libxkbcommon0 libxi6 libxrandr2 xvfb
      - name: Create editable sculpted monolithic city bodies with real carved public voids
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python studies/M3D-1S/J7/R33-S27/D48_R2_SCULPT/d48_r2_sculpted_city_p0.py /tmp/d48-r2-p0
      - name: Independent five-view image and real BLEND GLB reload gate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python - <<'PY'
          import bpy,json,hashlib
          from pathlib import Path
          from PIL import Image,ImageStat
          p=Path('/tmp/d48-r2-p0')
          m=json.loads((p/'D48_R2_P0_MANIFEST.json').read_text())
          assert m['study']=='D48_R2_P0_AUTHORED_B_MASS_AND_NEGATIVE_SPACE'
          assert m['art']=='UNREVIEWED' and not m['formal_adoption']
          assert not m['minecraft_write'] and not m['city_master_complete']
          assert m['carved_atriums']==4
          assert m['all_6_H_real_mass_bodies']
          assert m['camera_ground_clearance_m']>=179.9
          assert len(m['pngs'])==5
          for n in [m['edited_research_blend'],m['glb']]+m['pngs']:
              assert hashlib.sha256((p/n).read_bytes()).hexdigest()==m['sha256'][n]
          photos=[]
          for n in m['pngs']:
              with Image.open(p/n) as im:
                  rgb=im.convert('RGB')
                  assert rgb.size==(1320,800),n
                  photos.append((n,ImageStat.Stat(rgb).stddev))
                  assert sum(ImageStat.Stat(rgb).stddev)>12,n
          assert len({m['sha256'][n] for n in m['pngs']})==5
          bpy.ops.wm.open_mainfile(filepath=str(p/m['edited_research_blend']))
          sc=bpy.context.scene
          assert sc['D48_ART_REVIEW']=='PENDING_ACTUAL_5_VIEW_INSPECTION'
          assert sc['D48_FORMAL_DESIGN_ADOPTED'] is False
          assert sc['D48_MINECRAFT_WORLD_WRITTEN'] is False
          assert sc['D48_OFFICIAL_COORDINATE_MATCH'] is False
          assert sc['D48_CITY_MASTER_COMPLETE'] is False
          meshes={o.name:o for o in bpy.data.objects if o.type=='MESH'}
          assert len(meshes)==m['real_mesh_count']
          for name in ['M247C_WEST_TECTONIC_CITY_MANTLE','M247C_EAST_INHABITED_CIVIC_MANTLE']:
              assert name in meshes
              assert meshes[name]['REAL_CARVED_PUBLIC_VOID_COUNT']==2
              assert len(meshes[name].data.vertices)>100
          for i in range(1,7):
              assert any(o.get('CITY_SCOPE_ID')=='H'+str(i) and o.type=='MESH' for o in bpy.data.objects)
          for i in range(1,17):
              tag='SB'+str(i).zfill(2)
              assert any(o.get('CITY_SCOPE_ID')==tag and o.type=='EMPTY'
                         and o['GEOMETRY_COMPLETE'] is False for o in bpy.data.objects),tag
          assert len([o for o in bpy.data.objects if o.type=='CAMERA'])==5
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=str(p/m['glb']))
          assert len([o for o in bpy.data.objects if o.type=='MESH'])>=m['real_mesh_count']
          report={'source_tech':'LIMITED_PASS_NATIVE_BLENDER_BLEND_GLB_REOPEN',
             'image_gate':'5_REAL_CAMERAS_IMAGE_STATS_ONLY',
             'art':'NOT_REVIEWED_HUMAN_VISION','public_function':'UNCERTIFIED',
             'true_carved_atriums':4,'sb01_sb16':'UNMODELED_LOCATOR_ONLY',
             'formal_adoption':False,'city_master_complete':False,'minecraft_write':False}
          (p/'D48_R2_P0_INDEPENDENT_QA.json').write_text(json.dumps(report,indent=2))
          print('D48_R2_P0_REAL_EDITABLE_3D_TECH_LIMITED_PASS')
          PY
      - name: Save actual research output even if audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-D48-R2-P0-REAL-SCULPT-FIVE-ACTUAL-CAMERAS
          path: /tmp/d48-r2-p0/
          retention-days: 14
          if-no-files-found: warn
