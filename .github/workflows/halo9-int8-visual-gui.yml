name: HALO9 INT8 visible Blender desktop + verified real on-screen sculpt
on:
  push:
    branches:
      - research/r33-s27-d48-int8-visual-blender-ui-20261106
    paths:
      - .github/workflows/halo9-int8-visual-gui.yml
      - studies/M3D-1S/J7/R33-S27/INT8/gui_prepare.py
      - studies/M3D-1S/J7/R33-S27/INT8/gui_finalize.py
permissions:
  contents: write
concurrency:
  group: halo9-int8-ui-20261106
  cancel-in-progress: false
jobs:
  real_visible_desktop:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int8-visual-blender-ui-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT8
      SOURCE: studies/M3D-1S/J7/R33-S27/INT6/evidence/HALO9_INT6_TRUE_BRUSH_SCULPT_DISTRICTS.blend.gz
      SOURCE_SHA: 51ec4f2c58c74fe03dd44dc7ababcdec315dd77b556d27cfb9541b65d56b28fe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify immutable real Blender research source and script syntax
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" > /tmp/INT8_SOURCE.blend
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/INT8_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/gui_prepare.py" "$ROOT/gui_finalize.py"
          echo 'INT8_SOURCE_AND_SCRIPTS_VERIFIED'
      - name: Install real Linux virtual desktop and screenshot controls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11-utils openbox xdotool wmctrl scrot python3-pil libgl1-mesa-dri
      - name: Acquire SHA256-verified official Blender 5.2.1 binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/blender-int8 && cd /tmp/blender-int8
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o sums
          grep -F 'blender-5.2.1-linux-x64.tar.xz' sums | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Launch true Blender GUI, inspect live desktop, send physical mouse events, save via GUI Console
        run: |
          set -euo pipefail
          OUT=/tmp/halo9-int8-native
          mkdir -p "$OUT"
          export DISPLAY=:94
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :94 -screen 0 1600x1000x24 +extension GLX -nolisten tcp > "$OUT/XVFB.log" 2>&1 &
          XVFB_PID=$!
          for i in $(seq 1 20); do xdpyinfo -display :94 > /dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :94 > /dev/null
          openbox > "$OUT/OPENBOX.log" 2>&1 &
          B=/tmp/blender-int8/blender-5.2.1-linux-x64/blender
          timeout 780s "$B" --window-geometry 0 0 1520 930 --threads 2 \
            /tmp/INT8_SOURCE.blend --python "$ROOT/gui_prepare.py" -- \
            --output "$OUT" > "$OUT/BLENDER_GUI.log" 2>&1 &
          BLENDER_PID=$!
          ready=0
          for i in $(seq 1 105); do
            if test -s "$OUT/GUI_READY.json"; then ready=1; break; fi
            if ! kill -0 "$BLENDER_PID" 2>/dev/null; then
              tail -80 "$OUT/BLENDER_GUI.log" || true; exit 21
            fi
            sleep 1
          done
          test "$ready" -eq 1
          sleep 3
          WID=$(xdotool search --onlyvisible --class blender | head -n1)
          test -n "$WID"
          wmctrl -ir "$WID" -b add,maximized_vert,maximized_horz
          xdotool windowactivate --sync "$WID"
          sleep 3
          scrot -o "$OUT/BEFORE_REAL_GUI.png"
          # Blender VIEW_3D area occupies most of the left/central screen;
          # its saved viewport points to an actual existing sculpted surface.
          # Mouse coordinates intentionally remain in its center, not timeline.
          MX=670; MY=444
          xdotool mousemove --sync "$MX" "$MY"
          sleep 1
          xdotool mousedown 1
          for dx in $(seq -120 8 120); do
            xdotool mousemove --sync "$((MX+dx))" "$((MY + dx/6))"
            sleep 0.045
          done
          xdotool mouseup 1
          sleep 2
          scrot -o "$OUT/AFTER_REAL_MOUSE_SCULPT.png"
          # These are true keyboard events to a visible Blender Console;
          # the post script checks whether the MOUSE actually moved vertices.
          xdotool mousemove --sync "$MX" "$MY"
          xdotool key --clearmodifiers shift+F4
          sleep 2
          xdotool type --clearmodifiers --delay 3 "exec(open('studies/M3D-1S/J7/R33-S27/INT8/gui_finalize.py', encoding='utf8').read())"
          xdotool key Return
          committed=0
          for i in $(seq 1 70); do
            if test -s "$OUT/GUI_SAVE_PASS.json"; then committed=1; break; fi
            if ! kill -0 "$BLENDER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          scrot -o "$OUT/GUI_AFTER_CONSOLE.png"
          if test "$committed" -ne 1; then
            echo 'INT8_GUI_MOUSE_OR_SAVE_NOT_VERIFIED'
            test -f "$OUT/MOUSE_EDIT_CHECK.json" && cat "$OUT/MOUSE_EDIT_CHECK.json" || true
            exit 22
          fi
          xdotool mousemove --sync "$MX" "$MY"
          xdotool key --clearmodifiers shift+F5
          sleep 2
          scrot -o "$OUT/GUI_FINAL_VIEWPORT.png"
          cat "$OUT/GUI_SAVE_PASS.json"
          cp "$OUT/"*.png "$ROOT/native/"
          cp "$OUT/"*.json "$ROOT/native/"
          cp "$OUT/BLENDER_GUI.log" "$ROOT/native/"
          echo INT8_GUI_SCREEN_CAPTURE_AND_NATIVE_EDIT_VERIFIED
          kill "$BLENDER_PID" || true
          kill "$XVFB_PID" || true
      - name: Reopen truly edited BLEND in separate Blender process and compare data with baseline
        run: |
          set -euo pipefail
          cat > /tmp/verify_int8.py <<'PY'
          import bpy,json,hashlib,math
          from pathlib import Path
          p=Path(bpy.data.filepath);root=p.parent
          r=json.loads((root/'GUI_SAVE_PASS.json').read_text())
          initial=json.loads((root/'BEFORE_VERTICES.json').read_text())
          cameras=json.loads((root/'BEFORE_CAMERAS.json').read_text())
          assert p.name=='HALO9_INT8_GUI_MOUSE_EDITED_RESEARCH.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['saved_blend_sha256']
          assert r['native_edit_valid'] and r['real_window']
          assert r['physical_vertices_changed']>10 and r['max_vertex_displacement']>.02
          ob=bpy.data.objects[r['target']]
          assert len(ob.data.vertices)==len(initial)
          delta=[math.dist(tuple(v.co),xyz) for v,xyz in zip(ob.data.vertices,initial)]
          assert sum(x>.01 for x in delta)==r['physical_vertices_changed']
          assert abs(max(delta)-r['max_vertex_displacement'])<1e-5
          for n,m in cameras.items():
              c=bpy.data.objects[n].matrix_world
              assert max(abs(c[i][j]-m[i][j]) for i in range(4) for j in range(4))<1e-6
          s=bpy.context.scene
          assert s['CONSTRUCTION']=='HOLD' and s['COMPLETED_TARGETS']==0 and s['FORMAL_ART_ACCEPTED']==0
          assert s['INT8_SOURCE_SHA256']==r['source_sha256']
          print('INT8_INDEPENDENT_REAL_GUI_VERTEX_SAVED_PASS',flush=True)
          PY
          /tmp/blender-int8/blender-5.2.1-linux-x64/blender \
            --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT8_GUI_MOUSE_EDITED_RESEARCH.blend" \
            --python /tmp/verify_int8.py 2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'INT8_INDEPENDENT_REAL_GUI_VERTEX_SAVED_PASS' "$ROOT/native/INDEPENDENT.log"
      - name: Archive genuine GUI screenshot evidence and editable BLEND without art approval
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,os,hashlib,json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          root=Path(os.environ['ROOT']);n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          blend=n/'HALO9_INT8_GUI_MOUSE_EDITED_RESEARCH.blend'
          with blend.open('rb') as src,gzip.open(e/(blend.name+'.gz'),'wb',compresslevel=6) as dst:
              while chunk:=src.read(1048576):dst.write(chunk)
          for key in ('BEFORE_REAL_GUI','AFTER_REAL_MOUSE_SCULPT','GUI_FINAL_VIEWPORT'):
              p=n/(key+'.png')
              assert p.stat().st_size>20000
              im=Image.open(p).convert('RGB')
              assert im.size==(1600,1000), (key,im.size)
              im.thumbnail((1280,800))
              im.save(e/(key+'.png'),optimize=True)
          a=Image.open(n/'BEFORE_REAL_GUI.png').convert('RGB')
          b=Image.open(n/'AFTER_REAL_MOUSE_SCULPT.png').convert('RGB')
          diff=ImageChops.difference(a,b)
          changed_bbox=diff.getbbox()
          assert changed_bbox is not None
          result=json.loads((n/'GUI_SAVE_PASS.json').read_text())
          result['gui_before_png_sha256']=hashlib.sha256((n/'BEFORE_REAL_GUI.png').read_bytes()).hexdigest()
          result['gui_after_png_sha256']=hashlib.sha256((n/'AFTER_REAL_MOUSE_SCULPT.png').read_bytes()).hexdigest()
          result['screenshot_diff_bbox']=changed_bbox
          result['art']='NOT_APPROVED'
          result['technical_scope']='ONE_EXISTING_WEST_URBAN_SCULPT_MESH_IN_XVFB_DESKTOP'
          (e/'INT8_REAL_UI_SCULPT_NOT_ART.json').write_text(json.dumps(result,indent=2))
          print('INT8_REAL_DESKTOP_AND_EDIT_ARCHIVED',result['physical_vertices_changed'],flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT8: record real GUI screenshot and mouse-edited native study with independent proof [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int8-visual-blender-ui-20261106
          fi
      - name: Save raw native GUI logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT8-REAL-DESKTOP-AND-NATIVE-SCULPT
          path: |
            studies/M3D-1S/J7/R33-S27/INT8/native/
            /tmp/halo9-int8-native/
          retention-days: 5
          if-no-files-found: warn
