name: HALO9 LCS2 architecture-first inhabited urban section (real Blender)
on:
  push:
    branches:
      - research/r33-s27-d48-occupied-section-macro-rebuild-20261105
    paths:
      - studies/M3D-1S/J7/R33-S27/LCS2/author_section.py.bz2.b64
      - .github/workflows/halo9-lcs2-inhabited-section.yml
permissions:
  contents: write
concurrency:
  group: halo9-lcs2-inhabited-section
  cancel-in-progress: false
jobs:
  native_rebuild:
    if: github.ref == 'refs/heads/research/r33-s27-d48-occupied-section-macro-rebuild-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/LCS2
      SOURCE: studies/M3D-1S/J7/R33-S27/LCS1/R1_evidence/LCS1_R1_OCCUPIED_CITY_REVISION.blend.gz
      EXPECTED_SOURCE: 25a31c532d4e70556400b51882b58af7d42f27056755d2b5b6075b394dbd39f0
      SCRIPT_SHA: c81e52ca28ccc06f2581f9d7c7730a6748941ea97dc57184ae623f2cc8b8a849
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify immutable R1 research BLEND; reconstruct verified full author source
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" > /tmp/SECTION_R1_SOURCE.blend
          printf '%s  %s\n' "$EXPECTED_SOURCE" /tmp/SECTION_R1_SOURCE.blend | sha256sum -c -
          python3 - <<'PY'
          import os,base64,bz2,hashlib,py_compile
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          raw=bz2.decompress(base64.b64decode((root/'author_section.py.bz2.b64').read_text().strip()))
          sha=hashlib.sha256(raw).hexdigest()
          assert sha==os.environ['SCRIPT_SHA'], ('author-source-sha-mismatch',sha)
          script=root/'author_section.py'
          # One verified source-code repair: three intervals between four profiles.
          before="for i in range(4):\\n    a=west_profiles[i];b=west_profiles[i+1]"
          after="for i in range(len(west_profiles)-1):\\n    a=west_profiles[i];b=west_profiles[i+1]"
          source_text=raw.decode('utf-8')
          assert before in source_text
          script.write_text(source_text.replace(before,after),encoding='utf-8')
          py_compile.compile(str(script),doraise=True)
          print('LCS2_AUTHOR_SOURCE_VERIFIED',sha,len(raw),flush=True)
          PY
      - name: Install Blender 5.2.1 from checksum-verified official archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-blender
          cd /tmp/halo9-blender
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o checksums
          grep -F 'blender-5.2.1-linux-x64.tar.xz' checksums | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
          /tmp/halo9-blender/blender-5.2.1-linux-x64/blender --version | head -n 2
      - name: Re-author only isolated BLEND copy; genuinely render NAVE H1 aerial
        run: |
          set -euo pipefail
          B=/tmp/halo9-blender/blender-5.2.1-linux-x64/blender
          timeout 1300s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/SECTION_R1_SOURCE.blend --python "$ROOT/author_section.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/BLENDER_AUTHOR.log"
          grep -F 'LCS2_NATIVE_REAL_COMPLETE' "$ROOT/native/BLENDER_AUTHOR.log"
          test -s "$ROOT/native/LCS2_TRUE_ARCHITECTURAL_SECTION.blend"
      - name: Independent genuine Blender reopen and 3-image integrity
        run: |
          set -euo pipefail
          cat >/tmp/halo9_lcs2_reopen.py <<'PY'
          import bpy,hashlib,struct,json
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          assert p.name=='LCS2_TRUE_ARCHITECTURAL_SECTION.blend'
          assert s['CONSTRUCTION']=='HOLD' and s['FORMAL_ART_ACCEPTED']==0 and s['COMPLETED_TARGETS']==0
          assert s['LCS2_SOURCE_LCS1_R1_SHA256']=='25a31c532d4e70556400b51882b58af7d42f27056755d2b5b6075b394dbd39f0'
          r=json.loads((p.parent/'LCS2_AUTHOR_REPORT.json').read_text())
          assert r['output_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert r['cameras_unmodified'] and r['minecraft']=='HOLD'
          assert r['formal_art_acceptances']==0 and r['completed_targets']==0
          for name in ['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']:
              assert bpy.data.objects[name].type=='CAMERA'
              f=p.parent/'renders'/(name+'.png')
              with f.open('rb') as src:header=src.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',header[16:24])==(1100,825)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['render_png_sha256'][name]
          assert r['authored_new_meshes']>100 and r['removed_rejected_meshes']>200
          print('LCS2_INDEPENDENT_TRUE_BLENDER_PASS',r['output_sha256'],flush=True)
          PY
          B=/tmp/halo9-blender/blender-5.2.1-linux-x64/blender
          "$B" --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/LCS2_TRUE_ARCHITECTURAL_SECTION.blend" --python /tmp/halo9_lcs2_reopen.py \
            2>&1 | tee "$ROOT/native/INDEPENDENT_REOPEN.log"
          grep -F 'LCS2_INDEPENDENT_TRUE_BLENDER_PASS' "$ROOT/native/INDEPENDENT_REOPEN.log"
      - name: Preserve native source and real render for direct independent ART judgment
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import os,base64,gzip,hashlib,json
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat
          root=Path(os.environ['ROOT']);n=root/'native';d=root/'evidence';d.mkdir(parents=True,exist_ok=True)
          blend=n/'LCS2_TRUE_ARCHITECTURAL_SECTION.blend'
          with blend.open('rb') as src,gzip.open(d/(blend.name+'.gz'),'wb',compresslevel=6) as dst:
              while chunk:=src.read(1<<20): dst.write(chunk)
          names=['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']
          canvas=Image.new('RGB',(1650,444),(230,232,228));paint=ImageDraw.Draw(canvas);lum={}
          for i,name in enumerate(names):
              im=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              lum[name]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((550,412),Image.Resampling.LANCZOS)
              canvas.paste(im,(i*550,30));paint.text((i*550+8,8),name,fill=(0,0,0))
          jpg=d/'LCS2_TRUE_THREE_VIEW_AWAIT_ART_REVIEW.jpg'
          canvas.save(jpg,quality=83,optimize=True)
          (d/'LCS2_RENDER_PREVIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          a=json.loads((n/'LCS2_AUTHOR_REPORT.json').read_text())
          a['image_brightness']=lum
          a['review_mosaic_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          a['image_preflight']='VALID_CANDIDATE' if all(x>10 for x in lum.values()) else 'IMAGE_INVALID'
          a['art']='UNREVIEWED_NO_ADOPTION'
          (d/'LCS2_TECH_NOT_ART.json').write_text(json.dumps(a,indent=2))
          print('LCS2_NATIVE_PREVIEW_READY',len(jpg.read_bytes()),a['image_preflight'],lum,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/author_section.py" "$ROOT/evidence"
          if ! git diff --cached --quiet; then
            git commit -m 'LCS2: preserve genuine rebuilt section and render, ART review pending [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-occupied-section-macro-rebuild-20261105
          fi
      - name: Keep original full PNGs and true BLEND as temporary backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-LCS2-TRUE-BLENDER-521-ORIGINALS
          path: studies/M3D-1S/J7/R33-S27/LCS2/native/
          retention-days: 7
          if-no-files-found: warn
