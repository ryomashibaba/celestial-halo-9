name: J7-R8 graphical Blender architectural roof edit
on:
  push:
    branches: [research/m3d1s-j7-r8-civic-terraced-atrium-20261024]
    paths:
      - .github/workflows/halo9-j7-r8-gui.yml
      - studies/M3D-1S/J7/R8/gui/prepare_gui.py
      - studies/M3D-1S/J7/R8/gui/verify_gui.py
      - studies/M3D-1S/J7/R8/gui/run_gui.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-gui-architecture-edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout R8 research
        uses: actions/checkout@v4
      - name: Install genuine Blender graphical X11 viewport
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb xdotool scrot python3-numpy libgl1-mesa-dri
          blender --version | head -2
      - name: Use actual Blender viewport, edit crest and audit all changed vertices
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          rm -rf studies/M3D-1S/J7/R8/gui/outputs
          mkdir -p studies/M3D-1S/J7/R8/gui/outputs
          xvfb-run -a -s "-screen 0 1440x900x24" bash studies/M3D-1S/J7/R8/gui/run_gui.sh
          test -s studies/M3D-1S/J7/R8/gui/outputs/J7R8_REAL_GUI_EDIT_EVIDENCE.json
          test -s studies/M3D-1S/J7/R8/gui/outputs/J7R8_GUI_AFTER.blend
          test -s studies/M3D-1S/J7/R8/gui/outputs/J7R8_GUI_RESCULPTED_ACTUAL.glb
          test "$(find studies/M3D-1S/J7/R8/gui/outputs -name 'RENDER_*.png' | wc -l)" -eq 9
      - name: Immutable artifact, success or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo9-j7r8-real-GUI-edited-architecture
          path: studies/M3D-1S/J7/R8/gui/outputs
          if-no-files-found: warn
      - name: Save final edited BLEND/GLB and screen proof on branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R8/gui/outputs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] J7-R8: real GUI crest edited final BLEND and 9-view audit"
          git push origin HEAD:research/m3d1s-j7-r8-civic-terraced-atrium-20261024
