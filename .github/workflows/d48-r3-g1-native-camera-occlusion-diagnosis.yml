name: HALO9 D48 R3 G1 7-view native camera geometry-first obstruction diagnosis
on:
  push:
    branches:
      - research/r33-s27-d48-r3-visual-mesh-art-session-20261031
    paths:
      - '.github/workflows/d48-r3-g1-native-camera-occlusion-diagnosis.yml'
      - 'studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_camera_coverage_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  true-native-ray-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check independent analyzer syntax
        run: |
          python -m py_compile studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_camera_coverage_audit.py
      - uses: actions/download-artifact@v4
        with:
          name: HALO9-D48-R3-G1-TRUE-NATIVE-SCULPT-7-VIEW-REVIEW
          run-id: 41142560031
          github-token: ${{ github.token }}
          path: /tmp/halo9-r3-g1-original
      - name: Install true bpy
        run: |
          python -m pip install 'bpy==4.5.15'
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxrender1 libxkbcommon0 libxi6 libxrandr2 xvfb
      - name: Cast actual rendered camera rays against real scene objects
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python studies/M3D-1S/J7/R33-S27/D48_R3_VISUAL_SCULPT/r3_g1_camera_coverage_audit.py /tmp/halo9-r3-g1-original
      - name: Verify eye and all camera first-hit distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path=Path('/tmp/halo9-r3-g1-original/R3_G1_REAL_CAMERA_COVERAGE.json')
          d=json.loads(path.read_text())
          assert d['source_blend_sha256']=='f0f0f0bad' if False else d['original_sha_still_matches'] is True
          assert d['line_of_sight_only_no_walkability_certified'] is True
          assert d['ray_count_total']==5635
          for name,result in d['per_camera'].items():
              assert result['total_rays']==805
              assert sum(x['ray_count'] for x in result['top_first_hit_objects'])<=805
          assert len(d['per_camera'])==7
          print('NATIVE_GEOMETRY_CAMERA_OCCLUSION_QA_PASS',len(d['per_camera']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HALO9-D48-R3-G1-SEVEN-REAL-CAMERA-COVERAGE-DIAGNOSIS
          path: /tmp/halo9-r3-g1-original/R3_G1_REAL_CAMERA_COVERAGE.json
          retention-days: 14
          if-no-files-found: warn
