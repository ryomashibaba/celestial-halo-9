name: HALO9 D47 R6 2 Real Nonconcentric Urban-Axis Art G0
on:
  push:
    branches:
      - research/r33-s27-d47-r6-three-axis-civic-city-20261030
    paths:
      - 'studies/M3D-1S/J7/R33-S27/D47_R6_NATIVE/**'
      - '.github/workflows/d47-r6-urban-axes-art-g0.yml'
permissions:
  contents: write
jobs:
  render-and-archive-real-macro-a-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Blender 4.5.15
        run: |
          python -m pip install 'bpy==4.5.15' 'Pillow>=10'
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxrender1 libxkbcommon0 libxi6 libxrandr2 xvfb
      - name: Produce two actual geometry candidates with neutral 7-view images
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          xvfb-run -a python studies/M3D-1S/J7/R33-S27/D47_R6_NATIVE/r6_nonconcentric_inhabited_axes.py /tmp/r6
      - name: Independent native reopen and GLB audit; do not certify human occupation
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          import bpy
          from mathutils import Vector
          from PIL import Image,ImageChops
          p=Path('/tmp/r6');j=json.loads((p/'R6_G0_MANIFEST.json').read_text())
          assert j['not_claude_eb_spiral_copy'] and not j['art_adopted']
          assert len(j['variants'])==2
          stats={}
          for r in j['variants']:
            name=r['variant']
            assert len(r['axis_names'])==3 and len(r['render_names'])==7
            assert all((p/n).stat().st_size>2000 for n in r['render_names'])
            assert len(set(r['axis_names']))==3
            coords=list(r['axis_first_last_stations'].values())
            axes=[]
            for a,b in coords:
              dx=b[0]-a[0];dy=b[1]-a[1]
              import math
              az=math.degrees(math.atan2(dy,dx))
              axes.append(az)
            assert min(abs(axes[i]-axes[k]) for i in range(3) for k in range(i+1,3))>5,axes
            blend=p/r['native_blend'];glb=p/r['native_glb']
            assert blend.stat().st_size>25000 and glb.stat().st_size>25000
            bpy.ops.wm.open_mainfile(filepath=str(blend))
            assert bpy.context.scene.get('art_approved') is False
            assert bpy.context.scene.get('variant')==name
            objects=[o for o in bpy.data.objects if o.type=='MESH']
            assert len(objects)==r['scene_meshes'] and len(objects)>40
            streets=[o for o in objects if o.name.endswith('CENTER_OPEN_AIR_PUBLIC_STREET')]
            assert len(streets)==3,len(streets)
            original_count=len(objects)
            original_names={o.name for o in objects}
            bpy.ops.wm.read_factory_settings(use_empty=True)
            bpy.ops.import_scene.gltf(filepath=str(glb))
            res=[o for o in bpy.data.objects if o.type=='MESH']
            assert len(res)==original_count,(name,len(res),original_count)
            assert {o.name for o in res}==original_names
            stats[name]={'blender_native_meshes':original_count,
                'glb_import_meshes':len(res),
                'actual_three_urban_street_meshes':len(streets),
                'macro_axis_azimuth_deg':axes,
                'human_walk_or_rooms_tested':False,
                'art_approved':False}
          changed={}
          for f in j['variants'][0]['render_names']:
            idx=f.split('_',1)[1]
            a=Image.open(p/('A_'+idx)).convert('RGB')
            b=Image.open(p/('B_'+idx)).convert('RGB')
            assert a.size==b.size
            d=ImageChops.difference(a,b)
            changed[idx]=int(d.getbbox() is not None)
          assert all(changed.values()),changed
          audit={'status':'TECH_LIMITED_PASS_ART_UNREVIEWED',
                 'both_native_blend_and_glb_reimported':True,
                 'two_candidate_render_sets_differ':changed,
                 'art_not_approved':True,'no_formal_10km_master':True,
                 'full_human_traversal':False,'upper_transport':False,
                 'M247C_formal_art_changed':False,'minecraft_construction':False,
                 'study_results':stats}
          (p/'R6_G0_INDEPENDENT_TECH_AUDIT.json').write_text(json.dumps(audit,indent=2))
          print('R6_TWO_TRUE_BLENDER_AXES_MODEL_TECH_PASS_ART_UNREVIEWED',audit)
          PY
      - name: Retain real evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-R6-TWO-REAL-BLENDER-ART-G0-UNREVIEWED
          path: /tmp/r6/
          retention-days: 7
          if-no-files-found: warn
      - name: Package genuine evidence, source-data checksums
        if: success()
        run: |
          python - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          p=Path('/tmp/r6')
          dst=Path('studies/M3D-1S/J7/R33-S27/D47_R6_EVIDENCE')
          dst.mkdir(parents=True,exist_ok=True)
          names=['R6_G0_MANIFEST.json','R6_G0_INDEPENDENT_TECH_AUDIT.json']
          for v in ('A','B'):
            names.extend((v+'_G0_NATIVE_EDITABLE.blend',v+'_G0_GLTF.glb'))
            names.extend(v+'_'+n+'.png' for n in
               ('01_FRONT','02_OBLIQUE','03_SIDE','04_REAR',
                '05_AERIAL','06_GROUND_UP','07_CIVIC_VOID'))
          assert len(names)==20
          assert all((p/n).stat().st_size>100 for n in names)
          z=dst/'R6_A_B_REAL_BLENDER_ART_G0_UNREVIEWED.zip'
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as f:
            for n in names:f.write(p/n,n)
          data={'zip_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),
             'art_adopted':False,'M247_C_unmodified':True,
             'files_sha256':{n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names}}
          (dst/'R6_A_B_SHA256.json').write_text(json.dumps(data,indent=2))
          print('R6_ZIP_SHA256',data['zip_sha256'])
          PY
      - name: Archive two candidate real G0 proofs on R6 isolated branch only
        if: success()
        env:
          EXPECTED: research/r33-s27-d47-r6-three-axis-civic-city-20261030
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED"
          git config user.name 'halo9-r6-art-g0-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/M3D-1S/J7/R33-S27/D47_R6_EVIDENCE/
          git diff --cached --quiet && exit 0
          git commit -m 'R6 preserve real Blender A/B macro and 14 views, art G0 unreviewed'
          git push origin "HEAD:refs/heads/$EXPECTED"
