name: J7-R5 Blender inhabited civic section proof
on:
  push:
    branches: [research/m3d1s-j7-r5-blender-inhabited-civic-section-20261024]
    paths:
      - .github/workflows/halo9-j7-r5-blender.yml
      - studies/M3D-1S/J7/R5/build_blender_civic_section.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender-section:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Install real Blender 4 and native glTF dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb python3-numpy libgl1-mesa-dri
          blender --version | head -2
      - name: Model actual civic section, save BLEND GLB and nine view renders, fail closed
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf studies/M3D-1S/J7/R5/outputs
          mkdir -p studies/M3D-1S/J7/R5/outputs
          xvfb-run -a blender --background --factory-startup --python-exit-code 23 --python studies/M3D-1S/J7/R5/build_blender_civic_section.py -- studies/M3D-1S/J7/R5/outputs
          test -s studies/M3D-1S/J7/R5/outputs/J7R5_INHABITED_CIVIC_SECTION_NONCANONICAL.blend
          test -s studies/M3D-1S/J7/R5/outputs/J7R5_INHABITED_CIVIC_SECTION_NONCANONICAL.glb
          test -s studies/M3D-1S/J7/R5/outputs/J7R5_BLENDER_MODEL_EVIDENCE.json
          test "$(find studies/M3D-1S/J7/R5/outputs -name '*.png' | wc -l)" -eq 9
      - name: Archive study output even on render failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo9-j7r5-native-blender-art-research
          path: studies/M3D-1S/J7/R5/outputs/
          if-no-files-found: warn
      - name: Commit immutable models and renders only to isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R5/outputs/
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "[skip ci] J7-R5: actual native Blender 3D/BLEND and 9-view research output"
          git push origin HEAD:research/m3d1s-j7-r5-blender-inhabited-civic-section-20261024
