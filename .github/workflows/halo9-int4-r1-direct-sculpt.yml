name: HALO9 INT4 R1 actual same native BLEND visual-feedback mesh revision
on:
  push:
    branches:
      - research/r33-s27-d48-int4-r1-image-guided-sculpt-20261106
    paths:
      - studies/M3D-1S/J7/R33-S27/INT4_R1/direct_sculpt.py
      - .github/workflows/halo9-int4-r1-direct-sculpt.yml
permissions:
  contents: write
concurrency:
  group: halo9-int4-r1-direct-sculpt-20261106
  cancel-in-progress: false
jobs:
  physical_view_surgery:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int4-r1-image-guided-sculpt-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT4_R1
      ORIGINAL: studies/M3D-1S/J7/R33-S27/INT4/evidence/HALO9_INT4_CIVIC_SCULPTURE.blend.gz
      ORIGINAL_SHA: c71dbe46f7fda20aee6d1355720fc76b5c64d6c0a4ccf0b8bbaa0e210d2fff41
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read-only verify native INT4 source SHA and sculpt source syntax
        run: |
          set -euo pipefail
          test -s "$ORIGINAL"
          mkdir -p "$ROOT/native"
          gzip -dc "$ORIGINAL" > /tmp/INT4_R1_SOURCE.blend
          printf '%s  %s\n' "$ORIGINAL_SHA" /tmp/INT4_R1_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/direct_sculpt.py"
      - name: Obtain exact Blender 5.2.1 with official checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/blender_int4_r1
          cd /tmp/blender_int4_r1
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o checksums
          grep -F 'blender-5.2.1-linux-x64.tar.xz' checksums | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Directly reshape offending genuine transit mesh and rerender original camera views
        run: |
          set -euo pipefail
          B=/tmp/blender_int4_r1/blender-5.2.1-linux-x64/blender
          timeout 1740s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT4_R1_SOURCE.blend --python "$ROOT/direct_sculpt.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/DIRECT_MESH_AUTHOR.log"
          grep -F 'INT4_R1_SAME_NATIVE_SCENE_REVISED' "$ROOT/native/DIRECT_MESH_AUTHOR.log"
      - name: Independently reopen real edited BLEND, compare native hashes and three PNGs
        run: |
          set -euo pipefail
          cat > /tmp/verify_int4_r1.py <<'PY'
          import bpy,json,hashlib,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);sc=bpy.context.scene
          r=json.loads((p.parent/'INT4_R1_NATIVE_REPORT.json').read_text())
          assert p.name=='HALO9_INT4_R1_SCULPTED_VIEW_AND_PUBLIC_ACCESS.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['blend_sha256']
          assert r['source_sha256']==sc['INT4_R1_PARENT_SHA256']
          assert r['cameras_unchanged'] and len(r['surgical_geometry_changes'])==5
          assert r['original_camera_raycast']['E11_NAVE_HUMAN']['distance']<10
          assert r['original_camera_raycast']['E11_H1_HUMAN']['distance']<15
          for n in ('E11_NAVE_HUMAN','E11_H1_HUMAN'):
              d=r['revised_camera_raycast'][n]['distance']
              assert d is None or d>22
          assert sc['CONSTRUCTION']=='HOLD' and sc['COMPLETED_TARGETS']==0 and sc['FORMAL_ART_ACCEPTED']==0
          assert r['minecraft_construction']=='HOLD' and r['formal_art_adopted']==0 and r['completed_targets']==0
          for n in ('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL'):
              assert bpy.data.objects[n].type=='CAMERA'
              png=p.parent/'renders'/(n+'.png')
              with png.open('rb') as f:head=f.read(24)
              assert head[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',head[16:24])==(1100,825)
              assert hashlib.sha256(png.read_bytes()).hexdigest()==r['native_render_sha256'][n]
          print('INT4_R1_INDEPENDENT_NATIVE_TECH_PASS_NOT_ART_PASS',flush=True)
          PY
          /tmp/blender_int4_r1/blender-5.2.1-linux-x64/blender \
            --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT4_R1_SCULPTED_VIEW_AND_PUBLIC_ACCESS.blend" \
            --python /tmp/verify_int4_r1.py 2>&1 | tee "$ROOT/native/INDEPENDENT_REOPEN.log"
          grep -F 'INT4_R1_INDEPENDENT_NATIVE_TECH_PASS_NOT_ART_PASS' "$ROOT/native/INDEPENDENT_REOPEN.log"
      - name: Archive editable BLEND and actual fixed-comparison camera images, no adoption
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat,ImageDraw
          import os,gzip,base64,json,hashlib
          root=Path(os.environ['ROOT']);n=root/'native';ev=root/'evidence';ev.mkdir(exist_ok=True)
          p=n/'HALO9_INT4_R1_SCULPTED_VIEW_AND_PUBLIC_ACCESS.blend'
          with p.open('rb') as f,gzip.open(ev/(p.name+'.gz'),'wb',compresslevel=6) as g:
              while True:
                  part=f.read(1048576)
                  if not part:break
                  g.write(part)
          names=['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL']
          mosaic=Image.new('RGB',(1650,445),(229,227,221));draw=ImageDraw.Draw(mosaic)
          bright={}
          for i,name in enumerate(names):
              im=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              bright[name]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((550,412),Image.Resampling.LANCZOS)
              mosaic.paste(im,(i*550,32))
              draw.text((i*550+8,8),name,fill=(0,0,0))
          jpg=ev/'INT4_R1_ACTUAL_THREE_SAME_CAMERAS_UNREVIEWED.jpg'
          mosaic.save(jpg,quality=85,optimize=True)
          (ev/'INT4_R1_ACTUAL_THREE_CAMERAS_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          report=json.loads((n/'INT4_R1_NATIVE_REPORT.json').read_text())
          report['mean_brightness']=bright
          report['image_preflight']='VALID_CANDIDATE' if all(v>10 for v in bright.values()) else 'IMAGE_INVALID'
          report['mosaic_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          report['art']='UNREVIEWED_NOT_ADOPTED'
          (ev/'INT4_R1_TECH_NOT_ART.json').write_text(json.dumps(report,indent=2))
          print('INT4_R1_REVIEWABLE_GENUINE_IMAGE_ARCHIVED',bright,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT4 R1: preserve actual direct-edited BLEND and unreviewed fixed-view true images [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int4-r1-image-guided-sculpt-20261106
          fi
      - name: Temporary raw native evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT4-R1-RAW-NATIVE-SCULPT
          path: studies/M3D-1S/J7/R33-S27/INT4_R1/native/
          retention-days: 7
          if-no-files-found: warn
