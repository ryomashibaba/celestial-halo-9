name: HALO9 INT5 truly occupied dual fault city — actual Blender sculpt study
on:
  push:
    branches:
      - research/r33-s27-d48-int5-inhabited-rupture-sculpt-20261106
    paths:
      - studies/M3D-1S/J7/R33-S27/INT5/author_integrated_escarpment.py
      - .github/workflows/halo9-int5-native-inhabited-escarpment.yml
permissions:
  contents: write
concurrency:
  group: halo9-int5-native-sculpt-20261106
  cancel-in-progress: false
jobs:
  native_true_sculpt:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int5-inhabited-rupture-sculpt-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT5
      SOURCE: studies/M3D-1S/J7/R33-S27/INT4_R1/evidence/HALO9_INT4_R1_SCULPTED_VIEW_AND_PUBLIC_ACCESS.blend.gz
      SOURCE_SHA: 7cf765923b91f06cce7951fc3558f042e488bf9f1157791b59b14d11954dc2bb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify frozen study source SHA and editable Python syntax
        run: |
          set -euo pipefail
          test -s "$SOURCE"
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" > /tmp/INT5_SOURCE.blend
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/INT5_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_integrated_escarpment.py"
          echo INT5_VERIFIED_RESEARCH_SOURCE_NO_CANONICAL_WRITES
      - name: Acquire official Blender 5.2.1 with SHA256 validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-blender
          cd /tmp/halo9-blender
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o sums
          grep -F 'blender-5.2.1-linux-x64.tar.xz' sums | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Real Blender mesh sculpt and three unchanged-camera Cycles renders
        run: |
          set -euo pipefail
          B=/tmp/halo9-blender/blender-5.2.1-linux-x64/blender
          timeout 1820s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT5_SOURCE.blend --python "$ROOT/author_integrated_escarpment.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/BLENDER_AUTHOR.log"
          grep -F 'INT5_TRUE_NATIVE_COMPLETE' "$ROOT/native/BLENDER_AUTHOR.log"
      - name: Independently reopen Blender file and test actual PNG/SHA/physical bounds
        run: |
          set -euo pipefail
          cat > /tmp/verify_int5.py <<'PY'
          import bpy,hashlib,json,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          r=json.loads((p.parent/'INT5_NATIVE_REPORT.json').read_text())
          assert p.name=='HALO9_INT5_INHABITED_RUPTURE_SCULPT.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['blend_sha256']
          assert r['source_sha256']==s['INT5_PARENT_SHA256']
          assert r['replaced_thin_architecture']==22
          assert len(r['real_boolean_cavities'])==11
          assert s['CONSTRUCTION']=='HOLD' and s['FORMAL_ART_ACCEPTED']==0 and s['COMPLETED_TARGETS']==0
          assert r['formal_art_adopted']==0 and r['completed_targets']==0 and r['minecraft']=='HOLD'
          assert r['unchanged_original_cameras'] and r['created_meshes_by_role'].get('CITY',0)>=30
          for name in ('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL'):
              assert bpy.data.objects[name].type=='CAMERA'
              f=p.parent/'renders'/(name+'.png')
              with f.open('rb') as src: head=src.read(24)
              assert head[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',head[16:24])==(1100,825)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['render_sha256'][name]
          assert bpy.data.objects['INT5_M247_WEST_CONNECTED_INHABITED_ESCARPMENT'].type=='MESH'
          assert bpy.data.objects['INT5_M247_EAST_CONNECTED_INHABITED_ESCARPMENT'].type=='MESH'
          print('INT5_INDEPENDENT_ACTUAL_NATIVE_TECH_PASS_NOT_ART_PASS',flush=True)
          PY
          /tmp/halo9-blender/blender-5.2.1-linux-x64/blender --background --threads 2 \
            --python-exit-code 97 "$ROOT/native/HALO9_INT5_INHABITED_RUPTURE_SCULPT.blend" \
            --python /tmp/verify_int5.py 2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'INT5_INDEPENDENT_ACTUAL_NATIVE_TECH_PASS_NOT_ART_PASS' "$ROOT/native/INDEPENDENT.log"
      - name: Preserve the actual editable BLEND, PNG contact sheet, SHA evidence in isolated branch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat,ImageDraw
          import gzip,json,hashlib,base64,os
          root=Path(os.environ['ROOT']);native=root/'native'
          evidence=root/'evidence';evidence.mkdir(exist_ok=True)
          p=native/'HALO9_INT5_INHABITED_RUPTURE_SCULPT.blend'
          with p.open('rb') as src,gzip.open(evidence/(p.name+'.gz'),'wb',compresslevel=6) as out:
              while part:=src.read(1048576):out.write(part)
          names=('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL')
          canvas=Image.new('RGB',(1650,445),(226,226,224));draw=ImageDraw.Draw(canvas)
          brightness={}
          for i,name in enumerate(names):
              img=Image.open(native/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(img).mean)/3,2)
              img.thumbnail((550,412),Image.Resampling.LANCZOS)
              canvas.paste(img,(i*550,30))
              draw.text((i*550+9,8),name,fill=(0,0,0))
          jpg=evidence/'INT5_TRUE_THREE_FIXED_CAMERAS_UNREVIEWED.jpg'
          canvas.save(jpg,quality=85,optimize=True)
          (evidence/'INT5_TRUE_THREE_FIXED_CAMERAS_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          report=json.loads((native/'INT5_NATIVE_REPORT.json').read_text())
          report['mean_brightness']=brightness
          report['image_preflight']='VALID_CANDIDATE' if all(v>10 for v in brightness.values()) else 'IMAGE_INVALID'
          report['review_mosaic_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          report['art']='UNREVIEWED_NOT_ADOPTED'
          (evidence/'INT5_TECH_NOT_ART.json').write_text(json.dumps(report,indent=2))
          print('INT5_REAL_BLENDER_IMAGES_ARCHIVED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT5: preserve actual native occupied escarpment BLEND and unreviewed fixed-view PNG [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int5-inhabited-rupture-sculpt-20261106
          fi
      - name: Temporary full-resolution render and Blender logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT5-ACTUAL-BLEND-PNG-LOGS
          path: studies/M3D-1S/J7/R33-S27/INT5/native/
          retention-days: 7
          if-no-files-found: warn
