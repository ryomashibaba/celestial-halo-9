name: HALO9 INT2 one true inhabited-fault macro sculpt (isolated research only)
on:
  push:
    branches:
      - research/r33-s27-d48-int2-inhabited-fault-macro-20261106
    paths:
      - studies/M3D-1S/J7/R33-S27/INT2/author_integrated.py
      - .github/workflows/halo9-int2-native-macro-study.yml
permissions:
  contents: write
concurrency:
  group: halo9-int2-native-macro-20261106
  cancel-in-progress: false
jobs:
  integrated_sculpt:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int2-inhabited-fault-macro-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT2
      SOURCE: studies/M3D-1S/J7/R33-S27/INT1/evidence/HALO9_INT1_LIVED_CIVIC_ARCHITECTURE.blend.gz
      SOURCE_SHA: 422a60469123500e7eb4f5be886ed390665c9daadad3ad8c5e8a3b9699443100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify immutable archived Blender source, safety, and editable author
        run: |
          set -euo pipefail
          test -s "$SOURCE"
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" > /tmp/INT2_SOURCE.blend
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/INT2_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_integrated.py"
          echo "INT2_EXISTING_ARCHIVE_VERIFIED_NO_ORIGINAL_WRITES"
      - name: Obtain officially checksum-verified Blender 5.2.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-int2-blender
          cd /tmp/halo9-int2-blender
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o sums.sha256
          grep -F 'blender-5.2.1-linux-x64.tar.xz' sums.sha256 | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Sculpt one actual volumetric inhabited urban fault, render protected cameras
        run: |
          set -euo pipefail
          B=/tmp/halo9-int2-blender/blender-5.2.1-linux-x64/blender
          timeout 1800s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT2_SOURCE.blend --python "$ROOT/author_integrated.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/AUTHOR.log"
          grep -F 'INT2_NATIVE_FINISHED' "$ROOT/native/AUTHOR.log"
      - name: Independently reopen actual Blender file and verify three PNGs
        run: |
          set -euo pipefail
          cat > /tmp/halo9_verify_int2.py <<'PY'
          import bpy,json,hashlib,struct
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          r=json.loads((p.parent/'INT2_NATIVE_REPORT.json').read_text(encoding='utf8'))
          assert p.name=='HALO9_INT2_INHABITED_FAULT_MACRO.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['blend_sha256']
          assert s['INT2_SOURCE_SHA256']==r['source_sha256']
          assert s['CONSTRUCTION']=='HOLD' and s['FORMAL_ART_ACCEPTED']==0 and s['COMPLETED_TARGETS']==0
          assert r['formal_art_adopted']==0 and r['completed_targets']==0 and r['minecraft']=='HOLD'
          assert r['same_three_cameras'] and r['removed_rejected_architecture']>=6400
          assert r['new_mesh_count']>45 and len(r['boolean_cut_polygons'])==9
          for name in ('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL'):
              assert bpy.data.objects[name].type=='CAMERA'
              f=p.parent/'renders'/(name+'.png')
              with f.open('rb') as source:header=source.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',header[16:24])==(1100,825)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['render_hashes'][name]
          print('INT2_INDEPENDENT_NATIVE_TECH_PASS_NOT_ART_PASS',flush=True)
          PY
          /tmp/halo9-int2-blender/blender-5.2.1-linux-x64/blender \
            --background --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT2_INHABITED_FAULT_MACRO.blend" \
            --python /tmp/halo9_verify_int2.py 2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'INT2_INDEPENDENT_NATIVE_TECH_PASS_NOT_ART_PASS' "$ROOT/native/INDEPENDENT.log"
      - name: Preserve actual editable BLEND and human-reviewable 3-image montage (no art adoption)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          from pathlib import Path
          import os,gzip,base64,json,hashlib
          from PIL import Image,ImageStat,ImageDraw
          root=Path(os.environ['ROOT']);native=root/'native';ev=root/'evidence'
          ev.mkdir(exist_ok=True)
          blend=native/'HALO9_INT2_INHABITED_FAULT_MACRO.blend'
          with blend.open('rb') as source,gzip.open(ev/(blend.name+'.gz'),'wb',compresslevel=6) as dest:
              while True:
                  buf=source.read(1024*1024)
                  if not buf: break
                  dest.write(buf)
          mosaic=Image.new('RGB',(1650,445),(225,224,220));draw=ImageDraw.Draw(mosaic)
          brightness={}
          for i,n in enumerate(('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL')):
              im=Image.open(native/'renders'/(n+'.png')).convert('RGB')
              brightness[n]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((550,411),Image.Resampling.LANCZOS)
              mosaic.paste(im,(i*550,32))
              draw.text((i*550+9,10),n,fill=(0,0,0))
          image_path=ev/'INT2_ACTUAL_THREE_FIXED_CAMERAS_UNREVIEWED.jpg'
          mosaic.save(image_path,quality=86,optimize=True)
          (ev/'INT2_ACTUAL_THREE_FIXED_CAMERAS_BASE64.txt').write_text(
              base64.b64encode(image_path.read_bytes()).decode())
          native_report=json.loads((native/'INT2_NATIVE_REPORT.json').read_text())
          native_report['render_brightness']=brightness
          native_report['image_preflight']='VALID_CANDIDATE' if all(v>10 for v in brightness.values()) else 'IMAGE_INVALID'
          native_report['mosaic_sha256']=hashlib.sha256(image_path.read_bytes()).hexdigest()
          native_report['art']='UNREVIEWED_NOT_ADOPTED'
          (ev/'INT2_TECH_NOT_ART.json').write_text(json.dumps(native_report,indent=2),encoding='utf8')
          print('INT2_GENUINE_IMAGES_STORED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT2: archive truly editable macro research and unreviewed actual Blender renders [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int2-inhabited-fault-macro-20261106
          fi
      - name: Ephemeral full-resolution Blender proof and logs (not a formal art approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT2-RAW-BLEND-RENDERS-AND-LOGS
          path: studies/M3D-1S/J7/R33-S27/INT2/native/
          retention-days: 7
          if-no-files-found: warn
