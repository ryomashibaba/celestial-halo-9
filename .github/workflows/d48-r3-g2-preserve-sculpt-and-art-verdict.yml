name: HALO9 D48 R3 G2 save genuine Blender civic rift and art-rejected seven-view originals
on:
  push:
    branches:
      - research/r33-s27-d48-r3-g2-urban-rift-master-study-20261031
    paths:
      - '.github/workflows/d48-r3-g2-preserve-sculpt-and-art-verdict.yml'
permissions:
  contents: write
  actions: read
jobs:
  preserve-real-blender-and-reject-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin real 3D source run and source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41143500291" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41143500291" --jq '.head_sha')" = c1c594414208f4f399a6d57a5ac570d4575cdada
      - uses: actions/download-artifact@v4
        with:
          name: HALO9-D48-R3-G2-AUTHORED-INHABITED-CIVIC-RIFT-7-TRUE-ART-VIEWS
          run-id: 41143500291
          github-token: ${{ github.token }}
          path: /tmp/halo9-g2-genuine
      - name: Independently hash-check 9 originals, preserve unmodified native outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          src=Path('/tmp/halo9-g2-genuine')
          m=json.loads((src/'D48_R3_G2_NATIVE_MANIFEST.json').read_text())
          assert m['design']=='D48_R3_G2_MANUALLY_AUTHORED_TECTONIC_CIVIC_RIFT'
          assert len(m['sha256'])==9 and len(m['files']['images'])==7
          assert m['formal_adoption'] is False and m['minecraft_write'] is False
          assert m['city_master_complete'] is False and m['H1_H6_ENTIRE_DETAIL']=='NOT_COMPLETE'
          for f,sha in m['sha256'].items():
              assert hashlib.sha256((src/f).read_bytes()).hexdigest()==sha,f
          qa=json.loads((src/'G2_REOPEN_TECH_ONLY_QA.json').read_text())
          assert qa['art']=='NOT_REVIEWED_BY_HUMAN_VISION'
          verdict=Path('studies/M3D-1S/J7/R33-S27/D48_R3_G2_URBAN_RIFT/D48_R3_G2_SEVEN_REAL_VIEW_ART_VERDICT_JA.md')
          assert 'ART REJECT' in verdict.read_text(encoding='utf-8')
          dst=Path('studies/M3D-1S/J7/R33-S27/D48_R3_G2_EVIDENCE')
          dst.mkdir(parents=True,exist_ok=True)
          archive=dst/'D48_R3_G2_TRUE_BLENDER_7VIEWS_ART_REJECT.zip'
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(src.iterdir()):
                  assert f.is_file()
                  z.write(f,arcname=f.name)
              z.write(verdict,arcname=verdict.name)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert z.read('D48_R3_G2_NATIVE_MANIFEST.json')==(src/'D48_R3_G2_NATIVE_MANIFEST.json').read_bytes()
          record={'source_run':41143500291,'source_sha':'c1c594414208f4f399a6d57a5ac570d4575cdada',
                  'original_blend_sha256':m['sha256'][m['files']['blend']],
                  'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'archive_bytes':archive.stat().st_size,'verified_asset_hashes':9,
                  'city_master_complete':False,'art':'REJECT','formal_adoption':False,'minecraft_write':False}
          (dst/'D48_R3_G2_SOURCE_PROVENANCE.json').write_text(json.dumps(record,indent=2))
          print('D48_G2_REAL_NATIVE_ART_REJECT_ARCHIVED',record)
          PY
      - name: Save only to isolated research branch, not main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/r33-s27-d48-r3-g2-urban-rift-master-study-20261031
          git config user.name "halo9-research-evidence[bot]"
          git config user.email "halo9-research-evidence[bot]@users.noreply.github.com"
          git add studies/M3D-1S/J7/R33-S27/D48_R3_G2_EVIDENCE/
          git diff --cached --quiet && exit 0
          git commit -m "D48 R3 G2 preserve actual Blender originals, seven views and ART REJECT"
          git push origin "HEAD:$GITHUB_REF_NAME"
