name: HALO9 INT7 true native NAVE civic-rift sculpture and visual comparison
on:
  push:
    branches:
      - research/r33-s27-d48-int7-nave-civic-rift-rebuild-20261106
    paths:
      - studies/M3D-1S/J7/R33-S27/INT7/author_integrated_nave.py
      - .github/workflows/halo9-int7-real-nave.yml
permissions:
  contents: write
concurrency:
  group: halo9-int7-real-nave-20261106
  cancel-in-progress: false
jobs:
  render_and_archive:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int7-nave-civic-rift-rebuild-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT7
      SOURCE: studies/M3D-1S/J7/R33-S27/INT4_R1/evidence/HALO9_INT4_R1_SCULPTED_VIEW_AND_PUBLIC_ACCESS.blend.gz
      SOURCE_SHA: 7cf765923b91f06cce7951fc3558f042e488bf9f1157791b59b14d11954dc2bb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact research parent and author syntax
        run: |
          set -euo pipefail
          test -s "$SOURCE"
          mkdir -p "$ROOT/native"
          gzip -dc "$SOURCE" > /tmp/INT7_SOURCE.blend
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/INT7_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_integrated_nave.py"
          echo 'INT7_SAFE_PARENT_SHA_VERIFIED'
      - name: Acquire official checksum-verified Blender 5.2.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/int7-blender
          cd /tmp/int7-blender
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --connect-timeout 25 https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o SHA256SUMS
          grep -F 'blender-5.2.1-linux-x64.tar.xz' SHA256SUMS | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
      - name: Author actual integrated NAVE civic room and M247 inhabited rift in editable BLEND
        run: |
          set -euo pipefail
          B=/tmp/int7-blender/blender-5.2.1-linux-x64/blender
          timeout 1780s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT7_SOURCE.blend --python "$ROOT/author_integrated_nave.py" -- \
            --output "$ROOT/native" 2>&1 | tee "$ROOT/native/NATIVE_AUTHOR.log"
          grep -F 'INT7_NATIVE_NAVE_SCULPTURE_FINISHED' "$ROOT/native/NATIVE_AUTHOR.log"
      - name: Independently reopen real Blender source and verify full 5 PNGs
        run: |
          set -euo pipefail
          cat > /tmp/int7_verify.py <<'PY'
          import bpy,json,hashlib,struct,math
          from pathlib import Path
          p=Path(bpy.data.filepath);s=bpy.context.scene
          r=json.loads((p.parent/'INT7_NATIVE_EVIDENCE.json').read_text())
          assert p.name=='HALO9_INT7_NAVE_GREAT_OCCUPIED_RIFT.blend'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['native_blend_sha256']
          assert r['source_sha256']==s['INT7_PARENT_SHA256']
          assert s['CONSTRUCTION']=='HOLD' and s['FORMAL_ART_ACCEPTED']==0 and s['COMPLETED_TARGETS']==0
          assert r['formal_art_accepted']==r['completed_targets']==0 and r['minecraft']=='HOLD'
          assert r['rejected_nave_and_m247_objects_removed_in_study']>=80
          assert r['camera_original_matrices_unchanged'] is True
          for name in ('INT7_M247_ALPHA_WEST_LIVED_FAULT_SHEAR',
                       'INT7_M247_ALPHA_EAST_ASCENDING_CIVIC_SHEAR',
                       'INT7_NAVE_GREAT_CIVIC_ASSEMBLY_FLOOR',
                       'INT7_NAVE_LIBRARY_OCCUPIED_WEST_PUBLIC_FLOOR',
                       'INT7_NAVE_STATION_OCCUPIED_EAST_PLATFORM',
                       'INT7_NAVE_NORTH_RITUAL_CIVIC_ATRIUM'):
              o=bpy.data.objects[name]
              assert o.type=='MESH' and len(o.data.polygons)>2
              assert all(math.isfinite(c) for v in o.data.vertices for c in v.co)
          views=('E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL',
                 'INT7_NAVE_CIVIC_INTERIOR_DETAIL',
                 'INT7_M247_W0_SCULPTURE_OBLIQUE')
          for name in views:
              assert bpy.data.objects[name].type=='CAMERA'
              f=p.parent/'renders'/(name+'.png')
              with f.open('rb') as src:header=src.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',header[16:24])==(1100,825)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==r['render_sha256'][name]
          print('INT7_INDEPENDENT_NATIVE_REOPEN_PASS_NOT_ART_APPROVED',flush=True)
          PY
          /tmp/int7-blender/blender-5.2.1-linux-x64/blender --background \
            --threads 2 --python-exit-code 97 \
            "$ROOT/native/HALO9_INT7_NAVE_GREAT_OCCUPIED_RIFT.blend" \
            --python /tmp/int7_verify.py 2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F 'INT7_INDEPENDENT_NATIVE_REOPEN_PASS_NOT_ART_APPROVED' "$ROOT/native/INDEPENDENT.log"
      - name: Archive real BLEND and real five-view mosaic on isolated research branch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat,ImageDraw
          import os,gzip,json,hashlib,base64
          root=Path(os.environ['ROOT'])
          n=root/'native';e=root/'evidence';e.mkdir(exist_ok=True)
          p=n/'HALO9_INT7_NAVE_GREAT_OCCUPIED_RIFT.blend'
          with p.open('rb') as source,gzip.open(e/(p.name+'.gz'),'wb',compresslevel=6) as dest:
              while True:
                  chunk=source.read(1048576)
                  if not chunk:break
                  dest.write(chunk)
          views=['E11_NAVE_HUMAN','E11_H1_HUMAN','E11_URBAN_AERIAL',
            'INT7_NAVE_CIVIC_INTERIOR_DETAIL','INT7_M247_W0_SCULPTURE_OBLIQUE']
          canvas=Image.new('RGB',(1650,900),(226,226,223));draw=ImageDraw.Draw(canvas)
          brightness={}
          for i,name in enumerate(views):
              im=Image.open(n/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((550,410),Image.Resampling.LANCZOS)
              x=(i%3)*550;y=(i//3)*450
              canvas.paste(im,(x,y+32))
              draw.text((x+7,y+7),name,fill=(0,0,0))
          jpg=e/'INT7_REAL_FIVE_VIEW_UNREVIEWED.jpg'
          canvas.save(jpg,quality=85,optimize=True)
          (e/'INT7_REAL_FIVE_VIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          r=json.loads((n/'INT7_NATIVE_EVIDENCE.json').read_text())
          r['mean_brightness']=brightness
          r['image_preflight']='VALID_CANDIDATE' if all(v>10 for v in brightness.values()) else 'IMAGE_INVALID'
          r['mosaic_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          r['art']='UNREVIEWED_NOT_ADOPTED'
          (e/'INT7_TECH_NOT_ART.json').write_text(json.dumps(r,indent=2),encoding='utf8')
          print('INT7_ACTUAL_EVIDENCE_SAVED',brightness,flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT7: archive editable native NAVE and true fixed/extra camera renders [skip ci]'
            git push origin HEAD:refs/heads/research/r33-s27-d48-int7-nave-civic-rift-rebuild-20261106
          fi
      - name: Keep ephemeral full-resolution native evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT7-NATIVE-BLEND-FULL-RES-RENDERS
          path: studies/M3D-1S/J7/R33-S27/INT7/native/
          retention-days: 7
          if-no-files-found: warn
