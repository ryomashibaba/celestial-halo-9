name: HALO9 INT13 purposeful native NAVE H1 public inhabitation section + original/cutaway review
on:
  push:
    branches:
      - research/r33-s27-d48-int13-inhabited-civic-section-20261106
    paths:
      - .github/workflows/halo9-int13-purpose-first-native-section.yml
      - studies/M3D-1S/J7/R33-S27/INT13/author_functional_section.py
      - studies/M3D-1S/J7/R33-S27/INT13/independent_reopen.py
permissions:
  contents: write
concurrency:
  group: halo9-int13-purpose-first-20261106
  cancel-in-progress: false
jobs:
  native_civic_section:
    if: github.ref == 'refs/heads/research/r33-s27-d48-int13-inhabited-civic-section-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      ROOT: studies/M3D-1S/J7/R33-S27/INT13
      INPUT: studies/M3D-1S/J7/R33-S27/INT12/evidence/HALO9_INT12_E11_SCREEN_DIRECT_NATIVE_RESCULPT.blend.gz
      INPUT_SHA: 563773c54328f249978c0ed6d989edfc437d467a9d543a0b21511f99d6a508a1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read-only protected source SHA, real Python syntax and isolated research branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/research/r33-s27-d48-int13-inhabited-civic-section-20261106'
          test -s "$INPUT"
          mkdir -p "$ROOT/native"
          gzip -dc "$INPUT" > /tmp/INT13_SOURCE.blend
          printf '%s  %s\n' "$INPUT_SHA" /tmp/INT13_SOURCE.blend | sha256sum -c -
          python3 -m py_compile "$ROOT/author_functional_section.py" "$ROOT/independent_reopen.py"
          echo INT13_SOURCE_AND_SCRIPT_PASS
      - name: Get official SHA256-verified Blender 5.2.1 LTS
        run: |
          set -euo pipefail
          mkdir -p /tmp/halo9-int13-blender && cd /tmp/halo9-int13-blender
          curl -fL --retry 2 --connect-timeout 25 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 2 --connect-timeout 25 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256 -o official_sums
          sed -n '/blender-5.2.1-linux-x64.tar.xz/p' official_sums | \
            sed 's/blender-5.2.1-linux-x64.tar.xz$/blender.tar.xz/' | sha256sum -c -
          tar -xf blender.tar.xz
      - name: Actual Blender civic section, source-as-is original 3 views plus labeled cutaway 4 views
        run: |
          set -euo pipefail
          B=/tmp/halo9-int13-blender/blender-5.2.1-linux-x64/blender
          mkdir -p /tmp/halo9-int13
          timeout 1420s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/INT13_SOURCE.blend \
            --python "$ROOT/author_functional_section.py" -- \
            --output /tmp/halo9-int13 2>&1 | tee "$ROOT/native/TRUE_AUTHOR.log"
          grep -F INT13_TRUE_PURPOSE_FIRST_ARCHITECTURAL_SECTION_SAVED "$ROOT/native/TRUE_AUTHOR.log"
      - name: Independent Blender process reloads exact mesh, source flags, spatial graph and all 7 PNG hashes
        run: |
          set -euo pipefail
          B=/tmp/halo9-int13-blender/blender-5.2.1-linux-x64/blender
          timeout 190s "$B" --background --threads 2 --python-exit-code 97 \
            /tmp/halo9-int13/HALO9_INT13_PURPOSE_FIRST_INHABITED_SECTION.blend \
            --python "$ROOT/independent_reopen.py" \
            2>&1 | tee "$ROOT/native/INDEPENDENT.log"
          grep -F INT13_INDEPENDENT_REOPEN_PURPOSE_FIRST_3D_AND_7_PIXELS_PASS_NOT_ART "$ROOT/native/INDEPENDENT.log"
      - name: Preserve actual 3D and honest full-scene-versus-cutaway visual evidence, no art adoption
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import json,hashlib,gzip,os,base64
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat
          root=Path(os.environ['ROOT'])
          tmp=Path('/tmp/halo9-int13')
          evidence=root/'evidence';evidence.mkdir(exist_ok=True)
          src=tmp/'HALO9_INT13_PURPOSE_FIRST_INHABITED_SECTION.blend'
          with src.open('rb') as inf,gzip.open(evidence/(src.name+'.gz'),'wb',compresslevel=6) as outf:
              while block:=inf.read(1048576):outf.write(block)
          data=json.loads((tmp/'INT13_NATIVE_RESEARCH_NOT_ART.json').read_text())
          names=data['source_view_full_original_E11']+data['source_view_cutaway_art_rejected_shells_hidden']
          assert len(names)==7
          canvas=Image.new('RGB',(1920,1530),(222,221,216))
          draw=ImageDraw.Draw(canvas)
          brightness={}
          for i,name in enumerate(names):
              im=Image.open(tmp/'renders'/(name+'.png')).convert('RGB')
              brightness[name]=round(sum(ImageStat.Stat(im).mean)/3,2)
              im.thumbnail((480,359),Image.Resampling.LANCZOS)
              x=(i%4)*480;y=(i//4)*765
              canvas.paste(im,(x,y+35))
              suffix='FULL MASTER (old shell visible)' if i<3 else 'CUTAWAY ONLY (rejected shells hidden)'
              draw.text((x+8,y+7),name,fill=(0,0,0))
              draw.text((x+8,y+20),suffix,fill=(60,40,30))
          # The second row has a large blank lower area by design, but is
          # explicitly labeled and never presented as unchanged master.
          jpg=evidence/'INT13_REAL_FULL_VS_CUTAWAY_SEVEN_VIEWS_UNREVIEWED.jpg'
          canvas.save(jpg,quality=85,optimize=True)
          (evidence/'INT13_REAL_SEVEN_VIEW_BASE64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          data['render_mean_brightness']=brightness
          data['montage_sha256']=hashlib.sha256(jpg.read_bytes()).hexdigest()
          data['independent_reopen']='PASS'
          data['art']='UNREVIEWED_NOT_ADOPTED'
          (evidence/'INT13_INDEPENDENT_NATIVE_NOT_ART.json').write_text(json.dumps(data,indent=2))
          print('INT13_REAL_ARCHITECTURAL_SECTION_AND_7_ANNOTATED_IMAGES_ARCHIVED',flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/evidence/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT13: true purpose-first civic section with editable native BLEND and 7 full/cutaway images [skip ci]'
            git fetch origin research/r33-s27-d48-int13-inhabited-civic-section-20261106
            git rebase origin/research/r33-s27-d48-int13-inhabited-civic-section-20261106
            git push origin HEAD:refs/heads/research/r33-s27-d48-int13-inhabited-civic-section-20261106
          fi
      - name: Preserve source error and truthful blockers, no completion count
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/debug"
          for f in TRUE_AUTHOR.log INDEPENDENT.log; do
            test -f "$ROOT/native/$f" && cp "$ROOT/native/$f" "$ROOT/debug/$f" || true
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/debug/"
          if ! git diff --cached --quiet; then
            git commit -m 'INT13: preserve failed real Blender civic-section evidence [skip ci]'
            git fetch origin research/r33-s27-d48-int13-inhabited-civic-section-20261106
            git rebase origin/research/r33-s27-d48-int13-inhabited-civic-section-20261106
            git push origin HEAD:refs/heads/research/r33-s27-d48-int13-inhabited-civic-section-20261106
          fi
      - name: Temp native and full-resolution outputs for followup independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALO9-INT13-FUNCTION-FIRST-CIVIC-SECTION
          path: |
            /tmp/halo9-int13/
            studies/M3D-1S/J7/R33-S27/INT13/native/
          retention-days: 5
          if-no-files-found: warn
